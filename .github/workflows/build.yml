          5lGJ/ZfND735td18elKHO4lNk5wULlRqdxY9mvBDEA+SlSULjNpfSyplHXP6afJRBPRNEx0VBFIw
          TgqdYZ5KB3TTCPJzoW+l/A/J4vOHWfXvy+LJf6jXGN67xr9NCXKlyYwlM3rpwS49WJJEIuSII9YS
          W02oilDzAsmFCHpuGQ/ROFw9bY1OuJ16SOAypB16of3DztyBOw493pHrBX0gE3QMNgHD6/oHHVHW
          +wQEAAA=
          B64

      - name: "Segunda verificação (após as correções)"
        run: |
          cd "$PROJECT_DIR"
          fail=0
          if ! test -x gradlew; then
            echo "::error::gradlew continua sem permissão"
            fail=1
          fi
          for f in gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$APP_DIR/src/main/AndroidManifest.xml"; do
            if [ ! -f "$f" ]; then
              echo "::error::arquivo ausente: $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Segunda verificação FALHOU" >> "$REPORT_DIR/problems.txt"
            exit 1
          fi
          echo "Segunda verificação OK"

      - name: Instalar JDKs necessários
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_LIST }}

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        if: env.NDK_VERSION != ''
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Instalar Rust (se o projeto usar)
        if: env.HAS_RUST == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decidir tipos de build
        run: |
          debug=false; release=false
          has_secrets=false
          if [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then has_secrets=true; fi
          case "$BUILD_TYPE" in
            debug)   debug=true ;;
            release) release=true ;;
            both)    debug=true; release=true ;;
            *)       debug=true; [ "$has_secrets" = "true" ] && release=true ;;
          esac
          if [ "$release" = "true" ] && [ "$has_secrets" != "true" ]; then
            echo "::warning::Release pedido, mas faltam STORE_PASSWORD/KEY_PASSWORD. Release será ignorado."
            echo "Release ignorado: secrets de assinatura ausentes" >> "$REPORT_DIR/problems.txt"
            release=false
          fi
          echo "BUILD_DEBUG=$debug" >> "$GITHUB_ENV"
          echo "BUILD_RELEASE=$release" >> "$GITHUB_ENV"
          echo "Debug=$debug Release=$release"

      - name: Compilar Debug
        if: env.BUILD_DEBUG == 'true'
        run: |
          cd "$PROJECT_DIR"
          ./gradlew "${APP_PATH}:assembleDebug" --stacktrace --no-daemon

      - name: Compilar Release
        if: env.BUILD_RELEASE == 'true'
        run: |
          cd "$PROJECT_DIR"
          ./gradlew "${APP_PATH}:assembleRelease" --stacktrace --no-daemon

      - name: Coletar APKs
        if: always()
        run: |
          mkdir -p /tmp/apks
          cd "$PROJECT_DIR/$APP_DIR"
          find build/outputs/apk -type f -name '*.apk' 2>/dev/null | while read -r f; do
            name=$(basename "$f")
            if [ "$ARCH" != "all" ]; then
              case "$name" in
                *"$ARCH"*) ;;
                *universal*) ;;
                *) continue ;;
              esac
            fi
            cp "$f" "/tmp/apks/$name"
          done
          ls -lh /tmp/apks || true
          if [ -z "$(ls -A /tmp/apks 2>/dev/null)" ]; then
            echo "::warning::Nenhum APK encontrado para a arquitetura '$ARCH'."
          fi

      - name: Publicar APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-APK-${{ env.ARCH }}
          path: /tmp/apks/*.apk
          if-no-files-found: warn

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-verificacao
          path: /tmp/zreport/
          if-no-files-found: ignore

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Resumo da execução"
            echo "- ZIPs esperados/encontrados/aprovados: ${ZIPS_EXPECTED:-?}/${ZIPS_FOUND:-?}/${ZIPS_OK:-?}"
            echo "- Arquivos extraídos: ${FILES_EXTRACTED:-?}"
            echo "- Gradle ${GRADLE_VERSION:-?} | AGP ${AGP_VERSION:-?} | JDK ${JDK_MAIN:-?}"
            echo "### Problemas"
            cat "$REPORT_DIR/problems.txt" 2>/dev/null || true
            echo "### Correções automáticas"
            cat "$REPORT_DIR/fixed.txt" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          
