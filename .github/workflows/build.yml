
name: Build Zalith Launcher 2 APK

# ---------------------------------------------------------------------------
# COMPILACAO COMPLETA DO ZALITH LAUNCHER 2
# 22 pacotes ZIP - verificacao, extracao, analise e compilacao Android
# Publicacao dos APKs e relatorio como Artifacts
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Arquitetura do APK"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - arm64
          - arm
          - x86
          - x86_64
      build_type:
        description: "Tipo de compilacao"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - debug
          - release
          - both
  push:
    branches:
      - "**"

concurrency:
  group: zalith-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPORT_DIR: /tmp/zreport
  SRC_ROOT: /home/runner/zalith-src
  ARCH: ${{ github.event.inputs.arch || 'all' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'auto' }}

jobs:
  build:
    name: Verificar, corrigir e compilar Zalith Launcher 2
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    defaults:
      run:
        shell: bash

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:

      # ---------------------------------------------------------------------
      # 0. PREPARACAO
      # ---------------------------------------------------------------------

      - name: Checkout do repositorio
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Preparar ambiente e liberar espaco
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip p7zip-full

          mkdir -p "$REPORT_DIR" "$SRC_ROOT" /tmp/apks

          : > "$REPORT_DIR/problems.txt"
          : > "$REPORT_DIR/fixed.txt"
          : > "$REPORT_DIR/zips.txt"

          echo "Ambiente preparado."
          df -h /

      # ---------------------------------------------------------------------
      # 1. VERIFICACAO DOS 22 ZIPs
      # ---------------------------------------------------------------------

      - name: "Verificacao 1/4 - localizar e testar os 22 ZIPs"
        run: |
          set -uo pipefail

          ZIPS=(
            Zali-03.zip Zalit-04.zip Zalit-05.zip
            Zalit-06.zip Zalit-08.zip Zalit-10.zip
            Zalit-18.zip Zalith-01.zip Zalith-02.zip
            Zalith-09.zip Zalith-12.zip Zalith-13.zip
            Zalith-20.zip ZalithL-14.zip ZalithL-15.zip
            ZalithL-16.zip ZalithL-21.zip ZalithL-22.zip
            ZalithLa-07.zip ZalithLa-11.zip
            ZalithLa-17.zip ZalithLa-19.zip
          )

          find_one() {
            find "$GITHUB_WORKSPACE" -type f -name "$1" \
              -not -path '*/.git/*' 2>/dev/null |
              awk '{print length($0) "\t" $0}' |
              sort -n | cut -f2-
          }

          expected=${#ZIPS[@]}
          found=0
          ok=0

          for n in "${ZIPS[@]}"; do
            mapfile -t hits < <(find_one "$n")

            if [ "${#hits[@]}" -eq 0 ]; then
              echo "::error::ZIP ausente: $n"
              echo "ZIP ausente: $n" >> "$REPORT_DIR/problems.txt"
              continue
            fi

            found=$((found+1))
            f="${hits[0]}"
            size=$(stat -c %s "$f")
            magic=$(head -c 2 "$f" || true)

            if [ "$size" -lt 1024 ] || [ "$magic" != "PK" ]; then
              echo "::error::ZIP invalido: $n"
              echo "ZIP invalido: $n" >> "$REPORT_DIR/problems.txt"
              continue
            fi

            if ! unzip -tqq "$f" >/dev/null 2>&1; then
              echo "::error::ZIP corrompido: $n"
              echo "ZIP corrompido: $n" >> "$REPORT_DIR/problems.txt"
              continue
            fi

            entries=$(unzip -Z1 "$f" | grep -vc '/$' || true)

            echo "OK $n - $size bytes - $entries arquivos"
            echo "$f" >> "$REPORT_DIR/zips.txt"
            ok=$((ok+1))
          done

          readme=$(find "$GITHUB_WORKSPACE" -type f \
            -name 'LEIA-ME*' -not -path '*/.git/*' \
            2>/dev/null | head -1 || true)

          if [ -n "$readme" ]; then
            echo "$readme" > "$REPORT_DIR/readme_path.txt"
          fi

          {
            echo "ZIPS_EXPECTED=$expected"
            echo "ZIPS_FOUND=$found"
            echo "ZIPS_OK=$ok"
          } >> "$GITHUB_ENV"

          echo "ZIPs esperados: $expected"
          echo "ZIPs encontrados: $found"
          echo "ZIPs aprovados: $ok"

          if [ "$ok" -ne "$expected" ]; then
            echo "::error::Nem todos os 22 ZIPs foram aprovados."
            exit 1
          fi

      - name: Ler LEIA-ME
        continue-on-error: true
        run: |
          set -u

          [ -f "$REPORT_DIR/readme_path.txt" ] || exit 0

          f=$(cat "$REPORT_DIR/readme_path.txt")
          mkdir -p /tmp/leiame

          7z x -y -o/tmp/leiame "$f" >/dev/null 2>&1 || {
            echo "::warning::Nao foi possivel extrair o LEIA-ME."
            exit 0
          }

          find /tmp/leiame -type f -print

          find /tmp/leiame -type f -exec sh -c '
            echo "----- $1 -----"
            head -c 5000 "$1"
            echo
          ' _ {} \;

      # ---------------------------------------------------------------------
      # 2. EXTRACAO DOS PACOTES
      # ---------------------------------------------------------------------

      - name: "Verificacao 2/4 - extrair e detectar conflitos"
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys
          import zipfile
          import collections
          import stat

          src = os.environ["SRC_ROOT"]
          rep = os.environ["REPORT_DIR"]
          os.makedirs(src, exist_ok=True)

          zips = sorted(
              x.strip()
              for x in open(f"{rep}/zips.txt")
              if x.strip()
          )

          owners = collections.defaultdict(list)

          for z in zips:
              with zipfile.ZipFile(z) as zf:
                  for i in zf.infolist():
                      if i.is_dir() or i.filename.startswith("__MACOSX/"):
                          continue

                      name = i.filename.replace("\\", "/")
                      parts = name.split("/")

                      if name.startswith("/") or ".." in parts or "\x00" in name:
                          sys.exit(f"ERRO: caminho inseguro: {name}")

                      mode = (i.external_attr >> 16) & 0o170000
                      if mode == stat.S_IFLNK:
                          sys.exit(f"ERRO: link simbolico: {name}")

                      owners[name].append((z, i.CRC))

          conflicts = {
              n: v for n, v in owners.items()
              if len({crc for _, crc in v}) > 1
          }

          print("Arquivos:", len(owners))
          print("Conflitos:", len(conflicts))

          with open(f"{rep}/problems.txt", "a") as pf:
              for name, entries in conflicts.items():
                  msg = f"Conflito: {name}"
                  print("::warning::" + msg)
                  pf.write(msg + "\n")

          total = 0

          for z in zips:
              with zipfile.ZipFile(z) as zf:
                  for i in zf.infolist():
                      if i.is_dir() or i.filename.startswith("__MACOSX/"):
                          continue

                      name = i.filename.replace("\\", "/")
                      dest = os.path.abspath(os.path.join(src, name))

                      if os.path.commonpath([src, dest]) != os.path.abspath(src):
                          sys.exit(f"ERRO: caminho fora da origem: {name}")

                      os.makedirs(os.path.dirname(dest), exist_ok=True)

                      with zf.open(i) as r, open(dest, "wb") as w:
                          while True:
                              data = r.read(1024 * 1024)
                              if not data:
                                  break
                              w.write(data)

                      mode = (i.external_attr >> 16) & 0o777
                      if mode:
                          os.chmod(dest, mode & 0o755)

                      total += 1

          print(f"Extraidos {total} arquivos.")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"FILES_EXTRACTED={total}\n")
          PY

      # ---------------------------------------------------------------------
      # 3. IDENTIFICACAO DO PROJETO GRADLE
      # ---------------------------------------------------------------------

      - name: "Verificacao 3/4 - identificar projeto Android"
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import sys

          src = os.environ["SRC_ROOT"]
          skip = {"build", ".gradle", ".git", "node_modules", ".cxx", "target"}

          def walk(base):
              for d, dirs, files in os.walk(base):
                  dirs[:] = [x for x in dirs if x not in skip]
                  yield d, files

          def read(path):
              with open(path, encoding="utf-8", errors="ignore") as f:
                  return f.read()

          candidates = []

          for d, files in walk(src):
              for name in ("settings.gradle.kts", "settings.gradle"):
                  if name in files:
                      candidates.append(os.path.join(d, name))

          if not candidates:
              sys.exit("ERRO: settings.gradle nao encontrado.")

          settings = min(candidates, key=lambda p: p.count(os.sep))
          proj = os.path.dirname(settings)
          settings_text = read(settings)

          paths = list(dict.fromkeys(re.findall(
              r"""include\s*\(?\s*["'](:[^"']+)["']""",
              settings_text
          )))

          overrides = {}

          for m in re.finditer(
              r"""project\s*\(\s*["'](:[^"']+)["']\s*\)\s*\.projectDir\s*=\s*file\s*\(\s*["']([^"']+)["']\s*\)""",
              settings_text
          ):
              overrides[m.group(1)] = m.group(2)

          modules = []

          for p in paths:
              rel = overrides.get(p, p.strip(":").replace(":", "/"))
              directory = os.path.join(proj, rel)

              for filename in ("build.gradle.kts", "build.gradle"):
                  build = os.path.join(directory, filename)

                  if os.path.isfile(build):
                      content = read(build)

                      if "com.android.application" in content or "android.application" in content:
                          modules.append((p, rel, build))
                          break

          if not modules:
              for d, files in walk(proj):
                  for filename in ("build.gradle.kts", "build.gradle"):
                      if filename in files:
                          build = os.path.join(d, filename)
                          content = read(build)

                          if "com.android.application" in content or "android.application" in content:
                              rel = os.path.relpath(d, proj)
                              module = ":" + rel.replace(os.sep, ":").lstrip(":")
                              modules.append((module, rel, build))
                              break

          if not modules:
              sys.exit("ERRO: modulo Android application nao encontrado.")

          app_path, app_dir, app_build = modules[0]

          wrapper = os.path.join(proj, "gradlew")
          wrapper_jar = os.path.join(proj, "gradle/wrapper/gradle-wrapper.jar")
          wrapper_properties = os.path.join(proj, "gradle/wrapper/gradle-wrapper.properties")

          for path in (wrapper, wrapper_jar, wrapper_properties):
              if not os.path.isfile(path):
                  sys.exit("ERRO: arquivo Gradle ausente: " + path)

          os.chmod(wrapper, 0o755)

          match = re.search(r"gradle-([0-9.]+)-", read(wrapper_properties))
          gradle_version = match.group(1) if match else ""

          agp_match = re.search(
              r"com\.android\.tools\.build:gradle:([0-9.]+)",
              read(app_build)
          )
          agp = agp_match.group(1) if agp_match else ""

          main_jdk = "21" if gradle_version.startswith(("9.", "10.")) else "17"

          manifest = os.path.join(
              proj, app_dir, "src/main/AndroidManifest.xml"
          )

          if not os.path.isfile(manifest):
              sys.exit("ERRO: AndroidManifest.xml nao encontrado: " + manifest)

          counts = {"kt": 0, "java": 0, "xml": 0}

          for d, files in walk(proj):
              for filename in files:
                  ext = filename.rsplit(".", 1)[-1]
                  if ext in counts:
                      counts[ext] += 1

          env = {
              "PROJECT_DIR": proj,
              "APP_DIR": app_dir,
              "APP_PATH": app_path,
              "APP_BUILD_FILE": app_build,
              "GRADLE_VERSION": gradle_version,
              "AGP_VERSION": agp,
              "JDK_MAIN": main_jdk,
              "ANDROID_MANIFEST": manifest,
              "KOTLIN_FILES": str(counts["kt"]),
              "JAVA_FILES": str(counts["java"]),
              "XML_FILES": str(counts["xml"])
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key, value in env.items():
                  value = str(value).replace("\n", "").replace("\r", "")
                  f.write(f"{key}={value}\n")

          print("Projeto Android identificado com sucesso.")
          print("Raiz Gradle:", proj)
          print("Modulo:", app_path)
          print("Gradle:", gradle_version)
          print("AGP:", agp or "nao identificado")
          print("JDK:", main_jdk)
          print("Kotlin:", counts["kt"])
          print("Java:", counts["java"])
          print("XML:", counts["xml"])
          PY

      # ---------------------------------------------------------------------
      # 4. CONFIGURACAO DO ANDROID E GRADLE
      # ---------------------------------------------------------------------

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -1)
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nao encontrado."
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Instalar Rust quando necessario
        run: |
          set -euo pipefail

          if find "$PROJECT_DIR" -name Cargo.toml -print -quit | grep -q .; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal

            source "$HOME/.cargo/env"

            rustup target add \
              aarch64-linux-android \
              armv7-linux-androideabi \
              i686-linux-android \
              x86_64-linux-android

            cargo install cargo-ndk --locked
            rustc --version
            cargo --version
          else
            echo "Projeto sem Cargo.toml; Rust nao necessario."
          fi

      - name: Preparar Gradle
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          ./gradlew --version

      # ---------------------------------------------------------------------
      # 5. COMPILACAO DOS APKs
      # ---------------------------------------------------------------------

      - name: Verificar tarefas de compilacao
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ "$APP_PATH" = ":" ]; then
            PREFIX=""
          else
            PREFIX="${APP_PATH}:"
          fi

          echo "GRADLE_TASK_PREFIX=$PREFIX" >> "$GITHUB_ENV"

          ./gradlew tasks --all --no-daemon --console=plain \
            > "$REPORT_DIR/gradle-tasks.txt"

          grep -E 'assemble(Debug|Release)' \
            "$REPORT_DIR/gradle-tasks.txt" || true

      - name: Selecionar tipo de compilacao
        run: |
          set -euo pipefail

          TYPE="$BUILD_TYPE"

          if [ "$TYPE" = "auto" ]; then
            if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
              TYPE="release"
            else
              TYPE="debug"
            fi
          fi

          echo "FINAL_BUILD_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "Tipo selecionado: $TYPE"
          echo "Arquitetura solicitada: $ARCH"

      - name: Compilar APK Debug
        if: env.FINAL_BUILD_TYPE == 'debug' || env.FINAL_BUILD_TYPE == 'both'
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          TASK="${GRADLE_TASK_PREFIX}assembleDebug"

          echo "Executando $TASK"

          ./gradlew "$TASK" \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Compilar APK Release
        if: env.FINAL_BUILD_TYPE == 'release' || env.FINAL_BUILD_TYPE == 'both'
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          TASK="${GRADLE_TASK_PREFIX}assembleRelease"

          echo "Executando $TASK"

          ./gradlew "$TASK" \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ---------------------------------------------------------------------
      # 6. LOCALIZAR E PUBLICAR APKs
      # ---------------------------------------------------------------------

      - name: Localizar APKs gerados
        if: always()
        run: |
          set -euo pipefail

          mkdir -p /tmp/apks

          python3 - <<'PY'
          import os
          import shutil
          import hashlib

          root = os.environ["SRC_ROOT"]
          output = "/tmp/apks"
          found = []

          for base, dirs, files in os.walk(root):
              dirs[:] = [
                  d for d in dirs
                  if d not in ("intermediates", ".gradle", ".git")
              ]

              for name in files:
                  if not name.lower().endswith(".apk"):
                      continue

                  path = os.path.join(base, name)

                  if "/build/outputs/apk/" not in path.replace("\\", "/"):
                      continue

                  found.append(path)

          for source in found:
              relative = os.path.relpath(source, root)
              destination = os.path.join(output, relative)
              o
