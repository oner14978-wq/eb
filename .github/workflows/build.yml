
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Montar projeto e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. BAIXAR ARQUIVOS
      # ==========================================

      - name: Baixar arquivos do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ==========================================
      # 2. INSTALAR FERRAMENTAS
      # ==========================================

      - name: Instalar ferramentas de arquivos
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            zip \
            python3 \
            findutils \
            curl \
            build-essential \
            pkg-config \
            clang \
            cmake \
            ninja-build

      # ==========================================
      # 3. LOCALIZAR E REUNIR ZIPs
      # ==========================================

      - name: Extrair e reunir todos os ZIPs do Zalith
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p extracted/merged
          mkdir -p zip_diagnostics

          echo "======================================"
          echo "PROCURANDO ARQUIVOS ZIP"
          echo "======================================"

          mapfile -d '' PARTS < <(
            find . -maxdepth 5 -type f \
              -iname 'Zali*.zip' \
              -not -path './.git/*' \
              -print0 | sort -z
          )

          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "::error::Nenhum arquivo Zali*.zip foi encontrado."

            find . -type f -iname '*.zip' -print |
              sed -n '1,200p'

            exit 1
          fi

          echo "Total de ZIPs encontrados: ${#PARTS[@]}"

          INDEX=0

          for PART in "${PARTS[@]}"; do

            INDEX=$((INDEX + 1))

            echo ""
            echo "======================================"
            echo "ARQUIVO ${INDEX}: $PART"
            echo "======================================"

            if ! unzip -t "$PART" \
              > "zip_diagnostics/part-${INDEX}.txt" 2>&1; then

              echo "::error::ZIP inválido ou incompleto: $PART"

              cat "zip_diagnostics/part-${INDEX}.txt"

              exit 1
            fi

            echo "ZIP válido."
            echo "Reunindo arquivos..."

            unzip -oq "$PART" -d extracted/merged

          done

          echo "======================================"
          echo "EXTRAÇÃO CONCLUÍDA"
          echo "======================================"

          echo "Arquivos de configuração encontrados:"

          find extracted/merged -maxdepth 7 -type f \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -print | sort

      # ==========================================
      # 4. ENCONTRAR RAIZ DO PROJETO
      # ==========================================

      - name: Encontrar a raiz real do projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="extracted/merged"

          echo "Procurando gradlew..."

          mapfile -t WRAPPERS < <(
            find "$ROOT" -type f -name gradlew -print | sort
          )

          PROJECT_DIR=""

          for WRAPPER in "${WRAPPERS[@]}"; do

            CANDIDATE="$(dirname "$WRAPPER")"

            if [ -f "$CANDIDATE/settings.gradle" ] || \
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then

              PROJECT_DIR="$CANDIDATE"
              break

            fi

          done

          if [ -z "$PROJECT_DIR" ]; then

            echo "::error::Raiz Gradle não encontrada."

            echo "Wrappers encontrados:"

            printf '%s\n' "${WRAPPERS[@]}"

            echo "Estrutura disponível:"

            find "$ROOT" -maxdepth 7 -type f |
              sort | sed -n '1,600p'

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then

            echo "::error::Build Gradle principal não encontrado."

            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Raiz encontrada: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ESTRUTURA DO PROJETO"
          echo "======================================"

          find "$PROJECT_DIR" -maxdepth 4 -type d |
            sort | sed -n '1,400p'

      # ==========================================
      # 5. VERIFICAR MÓDULO PRINCIPAL
      # ==========================================

      - name: Verificar módulo ZalithLauncher
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Verificando módulo principal..."

          if [ ! -d "$PROJECT_DIR/ZalithLauncher" ]; then

            echo "::error::A pasta ZalithLauncher não foi encontrada."

            find "$PROJECT_DIR" -maxdepth 5 -type d |
              sort | sed -n '1,300p'

            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/ZalithLauncher/src" ]; then

            echo "::error::A pasta ZalithLauncher/src não foi encontrada."

            find "$PROJECT_DIR/ZalithLauncher" \
              -maxdepth 5 -type f |
              sort | sed -n '1,300p'

            exit 1
          fi

          echo "Módulo principal encontrado."

          find "$PROJECT_DIR/ZalithLauncher/src" \
            -maxdepth 4 -type f |
            sed -n '1,150p'

          echo "Verificação concluída."

      # ==========================================
      # 6. CONFIGURAR JAVA
      # ==========================================

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 7. CONFIGURAR ANDROID SDK
      # ==========================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 8. ACEITAR LICENÇAS ANDROID
      # ==========================================

      - name: Aceitar licenças do Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "ACEITANDO LICENÇAS"
          echo "======================================"

          set +o pipefail

          yes | sdkmanager --licenses
          SDK_STATUS=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then

            echo "::error::Falha ao aceitar licenças Android."

            exit "$SDK_STATUS"
          fi

          echo "Licenças aceitas."

      # ==========================================
      # 9. INSTALAR COMPONENTES ANDROID
      # ==========================================

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "INSTALANDO ANDROID SDK"
          echo "======================================"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo "======================================"
          echo "ANDROID SDK INSTALADO"
          echo "======================================"

          adb version

      # ==========================================
      # 10. INSTALAR RUST E CARGO-NDK
      # ==========================================

      - name: Instalar Rust e cargo-ndk
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "INSTALANDO RUST"
          echo "======================================"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi

          source "$HOME/.cargo/env"

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          rustup update stable
          rustup default stable

          echo "======================================"
          echo "INSTALANDO TARGETS ANDROID"
          echo "======================================"

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

          echo "======================================"
          echo "INSTALANDO CARGO-NDK"
          echo "======================================"

          cargo install cargo-ndk --locked

          echo "======================================"
          echo "CONFIGURANDO ANDROID NDK"
          echo "======================================"

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "::error::ANDROID_HOME e ANDROID_SDK_ROOT não estão definidos."
            exit 1
          fi

          NDK_VERSION="25.2.9519653"
          NDK_PATH="$SDK_PATH/ndk/$NDK_VERSION"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::Android NDK não encontrado: $NDK_PATH"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo "======================================"
          echo "VERIFICANDO RUST"
          echo "======================================"

          rustc --version
          cargo --version
          cargo ndk --version

          echo "======================================"
          echo "VERIFICANDO TARGETS"
          echo "======================================"

          rustup target list --installed

          echo "Rust e cargo-ndk preparados."

      # ==========================================
      # 11. DIAGNOSTICAR LWJGL
      # ==========================================

      - name: Diagnosticar módulos Gradle e LWJGL
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "VERIFICANDO LWJGL"
          echo "======================================"

          if [ -d "LWJGL" ]; then

            echo "Diretórios LWJGL:"

            find LWJGL -maxdepth 5 -type d |
              sort | sed -n '1,300p'

            echo "Arquivos LWJGL:"

            find LWJGL -maxdepth 5 -type f |
              sort | sed -n '1,400p'

          else

            echo "::warning::Pasta LWJGL não encontrada na raiz."

          fi

          echo "======================================"
          echo "VERIFICANDO SETTINGS GRADLE"
          echo "======================================"

          if [ -f settings.gradle.kts ]; then

            grep -n -E \
              'LWJGL|patches|include|projectDir' \
              settings.gradle.kts || true

          elif [ -f settings.gradle ]; then

            grep -n -E \
              'LWJGL|patches|include|projectDir' \
              settings.gradle || true

          fi

          echo "======================================"
          echo "VERIFICANDO PATCHES"
          echo "======================================"

          if [ -d "LWJGL/patches" ]; then

            echo "LWJGL/patches encontrado."

            find LWJGL/patches -maxdepth 4 -type f |
              sort | sed -n '1,200p'

          else

            echo "::warning::LWJGL/patches não existe."

            echo "Não será criada uma pasta vazia."

          fi

      # ==========================================
      # 12. VERIFICAR GRADLE
      # ==========================================

      - name: Verificar configuração Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "VERSÃO DO JAVA"
          echo "======================================"

          java -version

          echo "======================================"
          echo "VERSÃO DO GRADLE"
          echo "======================================"

          ./gradlew --version

          echo "======================================"
          echo "TAREFAS GRADLE"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks --all

      # ==========================================
      # 13. COMPILAR ZALITH
      # ==========================================

      - name: Compilar Zalith Launcher 2
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "INICIANDO COMPILAÇÃO"
          echo "======================================"

          echo "Verificando cargo-ndk..."

          command -v cargo
          command -v rustc
          command -v cargo-ndk

          cargo ndk --version

          echo "Verificando Android NDK..."

          echo "$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"

          echo "======================================"
          echo "COMPILANDO APK"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :ZalithLauncher:assembleDebug

          echo "======================================"
          echo "COMPILAÇÃO CONCLUÍDA"
          echo "======================================"

      # ==========================================
      # 14. LOCALIZAR APK
      # ==========================================

      - name: Localizar e verificar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Procurando APK..."

          mkdir -p final-apk

          mapfile -t APKS < <(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -print | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then

            echo "::error::Nenhum APK foi gerado."

            find "$PROJECT_DIR" -type d \
              -path '*/build/outputs/*' |
              sort | sed -n '1,200p'

            exit 1
          fi

          for APK in "${APKS[@]}"; do

            echo "APK encontrado: $APK"

            ls -lh "$APK"

            DEST="final-apk/$(basename "$APK")"

            if [ -e "$DEST" ]; then

              DEST="final-apk/$(basename "$(dirname "$(dirname "$(dirname "$APK")")")")-$(basename "$APK")"

            fi

            cp "$APK" "$DEST"

          done

          echo "======================================"
          echo "APKs GERADOS"
          echo "======================================"

          ls -lh final-apk

      # ==========================================
      # 15. SALVAR APK
      # ==========================================

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Launcher-2-APK-Debug
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 16. SALVAR DIAGNÓSTICOS
      # ==========================================

      - name: Salvar diagnóstico se a compilação falhar
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Build-Diagnostics
          path: |
            zip_diagnostics/
            extracted/
          if-no-files-found: ignore
          retention-days: 7
          
