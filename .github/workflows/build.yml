
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Reconstruct and Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================
      # 2. JAVA 21
      # ==========================================

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version

      # ==========================================
      # 3. ANDROID SDK
      # ==========================================

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "Android SDK: $SDK"

          sdkmanager --list > /tmp/sdk-list.txt

          echo "Plataformas Android 37 disponíveis:"
          grep -E 'platforms;android-37' /tmp/sdk-list.txt || true

          PLATFORM_PACKAGE="$(
            grep -oE 'platforms;android-37[^[:space:]]*' \
              /tmp/sdk-list.txt |
            sort -u |
            head -n 1 || true
          )"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERRO: Plataforma Android 37 não encontrada."
            grep -E 'platforms;android-' /tmp/sdk-list.txt || true
            exit 1
          fi

          echo "Instalando: $PLATFORM_PACKAGE"

          sdkmanager --install \
            "platform-tools" \
            "$PLATFORM_PACKAGE" \
            "ndk;25.2.9519653"

          test -d "$SDK/ndk/25.2.9519653"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"

      # ==========================================
      # 4. RUST
      # ==========================================

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustup toolchain install stable
          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

          cargo ndk --version

      # ==========================================
      # 5. DIAGNÓSTICO DOS ARQUIVOS
      # ==========================================

      - name: Diagnose repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ARQUIVOS DO REPOSITÓRIO"
          echo "======================================"

          find . -type f \
            -not -path './.git/*' \
            -printf '%p (%s bytes)\n' |
            sort

          echo "======================================"
          echo "PARTES DO ZALITH"
          echo "======================================"

          ls -lh \
            ./Zalith-01.zip \
            ./Zalith-02.zip \
            ./Zali-03.zip

      # ==========================================
      # 6. RECONSTRUIR E EXTRAIR O PROJETO
      # ==========================================

      - name: Reconstruct and extract project
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando Gradle Wrapper..."

          WRAPPER="$(
            find . -type f \
              -name gradlew \
              -not -path './.git/*' \
              -print -quit || true
          )"

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"

            echo "Projeto já extraído: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Gradle Wrapper não encontrado."
          echo "Usando os nomes reais das partes."

          PART1="./Zalith-01.zip"
          PART2="./Zalith-02.zip"
          PART3="./Zali-03.zip"

          for FILE in "$PART1" "$PART2" "$PART3"; do
            if [ ! -f "$FILE" ]; then
              echo "ERRO: Parte não encontrada: $FILE"
              exit 1
            fi

            if [ ! -s "$FILE" ]; then
              echo "ERRO: Arquivo vazio: $FILE"
              exit 1
            fi
          done

          echo "Partes identificadas:"
          ls -lh "$PART1" "$PART2" "$PART3"

          mkdir -p /tmp/zalith-parts
          ARCHIVE="/tmp/zalith-parts/ZalithLauncher2.zip"

          echo "Reconstruindo arquivo em ordem..."

          cat "$PART1" "$PART2" "$PART3" > "$ARCHIVE"

          echo "Arquivo reconstruído:"
          ls -lh "$ARCHIVE"

          echo "Verificando assinatura e conteúdo do ZIP..."

          mkdir -p extracted

          python3 - "$ARCHIVE" "$PWD/extracted" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          print("Arquivo:", archive)
          print("Destino:", destination)

          try:
              with zipfile.ZipFile(archive, "r") as z:
                  entries = z.infolist()

                  if not entries:
                      raise RuntimeError("O arquivo ZIP está vazio.")

                  print("Arquivos encontrados:", len(entries))

                  # Verifica a integridade de todos os arquivos.
                  damaged = z.testzip()

                  if damaged is not None:
                      raise RuntimeError(
                          "Arquivo danificado: " + damaged
                      )

                  print("Integridade dos arquivos confirmada.")

                  # Impede caminhos de extração fora da pasta.
                  root = destination.resolve()

                  for entry in entries:
                      target = (root / entry.filename).resolve()

                      if target != root and root not in target.parents:
                          raise RuntimeError(
                              "Caminho inseguro no ZIP: " + entry.filename
                          )

                  print("Extraindo arquivos...")

                  z.extractall(root)

                  print("Extração concluída.")

          except Exception as error:
              print("ERRO AO PROCESSAR O ARQUIVO:", error)
              sys.exit(1)
          PY

          echo "Localizando Gradle Wrapper..."

          WRAPPER="$(
            find extracted -type f \
              -name gradlew \
              -print -quit || true
          )"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew não foi encontrado."
            echo "Primeiros arquivos extraídos:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: Arquivo settings.gradle não encontrado."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Projeto localizado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VALIDAR PROJETO
      # ==========================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Diretório do projeto:"
          pwd

          echo "Conteúdo:"
          ls -la

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERRO: Projeto Gradle inválido."
            exit 1
          fi

          chmod +x gradlew

          echo "Projeto Gradle validado."

      # ==========================================
      # 8. VALIDAR FERRAMENTAS
      # ==========================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          echo "Java:"
          java -version

          echo "Rust:"
          rustc --version

          echo "Cargo NDK:"
          cargo ndk --version

          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Android NDK: $ANDROID_NDK_HOME"

          echo "Gradle:"
          ./gradlew --version

      # ==========================================
      # 9. LISTAR TAREFAS
      # ==========================================

      - name: List Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon tasks

      # ==========================================
      # 10. COMPILAR APK
      # ==========================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          echo "======================================"
          echo "COMPILANDO ZALITH LAUNCHER 2"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # ==========================================
      # 11. LOCALIZAR APK
      # ==========================================

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              ! -name '*-androidTest.apk' |
              sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERRO: Nenhum APK foi encontrado."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APKs encontrados:"
          printf '%s\n' "${APKS[@]}"

          APK="${APKS[0]}"

          echo "APK selecionado: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 12. ENVIAR APK
      # ==========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 13. RELATÓRIOS DE COMPILAÇÃO
      # ==========================================

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Build-Reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
          
