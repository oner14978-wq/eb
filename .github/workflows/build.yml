
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Montar projeto e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Instalar ferramentas de arquivos
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y unzip zip python3 findutils

      - name: Localizar e extrair automaticamente todos os ZIPs
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p extracted
          mkdir -p zip_diagnostics

          echo "======================================"
          echo "PROCURANDO ARQUIVOS ZALI*.ZIP"
          echo "======================================"

          mapfile -d '' PARTS < <(
            find . -maxdepth 5 -type f \
              -iname 'Zali*.zip' \
              -not -path './.git/*' \
              -print0 | sort -z
          )

          echo "Arquivos encontrados: ${#PARTS[@]}"

          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "::error::Nenhum arquivo Zali*.zip foi encontrado."
            echo "Arquivos ZIP disponíveis:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          printf '%s\n' "${PARTS[@]}"

          INDEX=0

          for PART in "${PARTS[@]}"; do
            INDEX=$((INDEX + 1))
            DEST="extracted/part-${INDEX}"

            echo ""
            echo "======================================"
            echo "ARQUIVO ${INDEX}: ${PART}"
            echo "======================================"

            mkdir -p "$DEST"

            if unzip -t "$PART" > "zip_diagnostics/part-${INDEX}.txt" 2>&1; then
              echo "ZIP válido. Extraindo individualmente..."
              unzip -oq "$PART" -d "$DEST"
            else
              echo "::error::ZIP inválido ou incompleto: $PART"
              cat "zip_diagnostics/part-${INDEX}.txt"
              exit 1
            fi
          done

          echo "Extração concluída."

          find extracted -maxdepth 6 -type f \
            \( -name 'gradlew' \
            -o -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \) \
            -print | sort

      - name: Encontrar a raiz real do projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Procurando gradlew e configurações Gradle..."

          mapfile -t WRAPPERS < <(
            find extracted -type f -name gradlew -print | sort
          )

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::Não foi encontrado gradlew."
            find extracted -maxdepth 6 -type f | sort | head -n 500
            exit 1
          fi

          PROJECT_DIR=""

          for WRAPPER in "${WRAPPERS[@]}"; do
            CANDIDATE="$(dirname "$WRAPPER")"

            if [ -f "$CANDIDATE/settings.gradle" ] || \
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::gradlew encontrado, mas settings.gradle não foi localizado na mesma raiz."
            printf '%s\n' "${WRAPPERS[@]}"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::O build.gradle principal não foi encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$PROJECT_DIR/gradlew"
          ls -la "$PROJECT_DIR"

      - name: Verificar módulo ZalithLauncher
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Verificando módulo principal..."

          if [ ! -d "$PROJECT_DIR/ZalithLauncher" ]; then
            echo "::error::A pasta ZalithLauncher não foi encontrada."
            find "$PROJECT_DIR" -maxdepth 4 -type d | sort
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/ZalithLauncher/src" ]; then
            echo "::error::A pasta ZalithLauncher/src não foi encontrada."
            find "$PROJECT_DIR/ZalithLauncher" -maxdepth 5 -type f | sort | head -n 300
            exit 1
          fi

          echo "Módulo principal encontrado."
          find "$PROJECT_DIR/ZalithLauncher/src" -maxdepth 3 -type f | head -n 100

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "ACEITANDO LICENÇAS DO ANDROID SDK"
          echo "======================================"

          set +o pipefail
          yes | sdkmanager --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "::error::Falha ao aceitar as licenças do Android SDK."
            exit "$SDK_STATUS"
          fi

          echo "Licenças aceitas."

          echo "======================================"
          echo "INSTALANDO COMPONENTES ANDROID"
          echo "======================================"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo "======================================"
          echo "ANDROID SDK CONFIGURADO"
          echo "======================================"

      - name: Verificar configuração Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          echo "Versão do Java:"
          java -version

          echo "Versão do Gradle:"
          ./gradlew --version

          echo "Tarefas Gradle disponíveis:"
          ./gradlew --no-daemon tasks --all

      - name: Compilar Zalith Launcher 2
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :ZalithLauncher:assembleDebug

      - name: Localizar e verificar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Procurando APK gerado..."

          mapfile -t APKS < <(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -print | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Nenhum APK foi gerado."
            find "$PROJECT_DIR" -type d -path '*/build/outputs/*' -print
            exit 1
          fi

          mkdir -p final-apk

          for APK in "${APKS[@]}"; do
            echo "APK encontrado: $APK"
            ls -lh "$APK"
            cp "$APK" "final-apk/$(basename "$APK")"
          done

          echo "APKs disponíveis:"
          ls -lh final-apk

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Launcher-2-APK-Debug
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Salvar diagnóstico se a compilação falhar
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Build-Diagnostics
          path: |
            zip_diagnostics/
            extracted/
          if-no-files-found: ignore
          retention-days: 7
          
