name: Build Zalith Launcher 2 APK

# Zalith Launcher 2: verifica os 22 ZIPs, corrige e compila o APK (Artifact).
# Os ZIPs são extraídos em /home/runner/zalith-src, fora do repositório.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Arquitetura do APK (all = universal, maior)"
        required: true
        default: "all"
        type: choice
        options: ["all", "arm64", "arm", "x86", "x86_64"]
      build_type:
        description: "auto = Debug sempre + Release se houver secrets de assinatura"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "debug", "release", "both"]
  push:
    branches: ["**"]

concurrency:
  group: zalith-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPORT_DIR: /tmp/zreport
  SRC_ROOT: /home/runner/zalith-src
  ARCH: ${{ github.event.inputs.arch || 'all' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'auto' }}

jobs:
  build:
    name: Verificar, corrigir e compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Liberar espaço em disco e preparar relatório
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          mkdir -p "$REPORT_DIR" "$SRC_ROOT"
          : > "$REPORT_DIR/problems.txt"
          : > "$REPORT_DIR/fixed.txt"
          df -h / | tail -1

      - name: "Verificação 1/4 - localizar e testar os arquivos ZIP"
        run: |
          set -uo pipefail
          ZIPS=(
            Zali-03.zip Zalit-04.zip Zalit-05.zip Zalit-06.zip Zalit-08.zip
            Zalit-10.zip Zalit-18.zip Zalith-01.zip Zalith-02.zip Zalith-09.zip
            Zalith-12.zip Zalith-13.zip Zalith-20.zip ZalithL-14.zip ZalithL-15.zip
            ZalithL-16.zip ZalithL-21.zip ZalithL-22.zip ZalithLa-07.zip
            ZalithLa-11.zip ZalithLa-17.zip ZalithLa-19.zip
          )
          expected=${#ZIPS[@]}; found=0; ok=0
          : > "$REPORT_DIR/zips.txt"

          find_one() { # procura na raiz e em subpastas; prefere o caminho mais curto
            find "$GITHUB_WORKSPACE" -type f -name "$1" -not -path '*/.git/*' 2>/dev/null \
              | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2-
          }

          for n in "${ZIPS[@]}"; do
            mapfile -t hits < <(find_one "$n")
            if [ "${#hits[@]}" -eq 0 ]; then
              echo "::error::ZIP ausente no repositório: $n"
              echo "ZIP ausente: $n" >> "$REPORT_DIR/problems.txt"; continue
            fi
            found=$((found+1))
            f="${hits[0]}"
            [ "${#hits[@]}" -gt 1 ] && echo "::warning::$n aparece ${#hits[@]}x; usando $f"
            size=$(stat -c %s "$f")
            magic=$(head -c2 "$f" 2>/dev/null)
            if [ "$size" -lt 1024 ] || [ "$magic" != "PK" ]; then
              echo "::error::$n não é um ZIP válido (tamanho=$size). Se o repositório usa Git LFS, confirme que os arquivos foram baixados."
              echo "ZIP inválido/ponteiro LFS: $n ($size bytes)" >> "$REPORT_DIR/problems.txt"; continue
            fi
            if ! unzip -tqq "$f" >/dev/null 2>&1; then
              echo "::error::Falha no teste de integridade: $n"
              echo "ZIP corrompido: $n" >> "$REPORT_DIR/problems.txt"; continue
            fi
            entries=$(unzip -Z1 "$f" | grep -vc '/$' || true)
            printf 'OK  %-18s %10s bytes  %5s arquivos  (%s)\n' "$n" "$size" "$entries" "${f#$GITHUB_WORKSPACE/}"
            echo "$f" >> "$REPORT_DIR/zips.txt"
            ok=$((ok+1))
          done

          # LEIA-ME: o nome pedido é LEIA-ME.72; o arquivo real do pacote chama-se LEIA-ME.7z
          readme=""
          for cand in "LEIA-ME.72" "LEIA-ME.7z" "LEIA-ME*"; do
            r=$(find_one "$cand" | head -1); [ -n "$r" ] && { readme="$r"; break; }
          done
          if [ -n "$readme" ]; then
            echo "$readme" > "$REPORT_DIR/readme_path.txt"
            [ "$(basename "$readme")" != "LEIA-ME.72" ] && \
              echo "::notice::'LEIA-ME.72' não existe; usando '$(basename "$readme")' (provável erro de digitação no nome)."
          else
            echo "::warning::LEIA-ME não encontrado (não é necessário para compilar)."
            echo "LEIA-ME não encontrado (opcional)" >> "$REPORT_DIR/problems.txt"
          fi

          {
            echo "ZIPS_EXPECTED=$expected"
            echo "ZIPS_FOUND=$found"
            echo "ZIPS_OK=$ok"
          } >> "$GITHUB_ENV"
          echo "ZIPs esperados=$expected encontrados=$found aprovados=$ok"
          [ "$ok" -eq "$expected" ] || { echo "::error::Nem todos os ZIPs passaram na verificação."; exit 1; }

      - name: Ler o LEIA-ME (informativo)
        continue-on-error: true
        run: |
          [ -f "$REPORT_DIR/readme_path.txt" ] || exit 0
          f=$(cat "$REPORT_DIR/readme_path.txt")
          command -v 7z >/dev/null 2>&1 || sudo apt-get install -y -qq p7zip-full >/dev/null
          mkdir -p /tmp/leiame && 7z x -y -p"" -o/tmp/leiame "$f" >/dev/null 2>&1 \
            || 7z x -y -o/tmp/leiame "$f" >/dev/null 2>&1 \
            || { echo "::warning::Não foi possível abrir $f"; exit 0; }
          echo "----- conteúdo de $(basename "$f") -----"
          find /tmp/leiame -type f -exec sh -c 'echo "## $1"; head -c 4000 "$1"; echo' _ {} \;

      - name: "Verificação 2/4 - extrair para estrutura organizada e detectar conflitos"
        run: |
          base64 -d <<'B64' | gunzip | python3 -
          H4sIAAAAAAACA71WUW8jNRB+z68Y7QNa65ZtiwSV9i6VjlwPKgE9pQGdrkQrZ9duTXbtxXaSXkp+
