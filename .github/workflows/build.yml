
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Reconstruct and Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================
      # 2. JAVA 21
      # ==========================================

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          set -euo pipefail
          java -version
          javac -version

      # ==========================================
      # 3. ANDROID SDK
      # ==========================================

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "Android SDK: $SDK"

          echo "Procurando plataformas Android 37 disponíveis..."

          sdkmanager --list > /tmp/sdk-list.txt

          cat /tmp/sdk-list.txt | grep -E 'platforms;android-37|build-tools;37' || true

          PLATFORM_PACKAGE="$(grep -oE 'platforms;android-37[^[:space:]]*' /tmp/sdk-list.txt | sort -u | head -n 1 || true)"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERRO: Nenhuma plataforma Android 37 encontrada."
            echo "Pacotes disponíveis:"
            grep -E 'platforms;android-' /tmp/sdk-list.txt | tail -30 || true
            exit 1
          fi

          echo "Plataforma encontrada: $PLATFORM_PACKAGE"

          sdkmanager --install \
            "platform-tools" \
            "$PLATFORM_PACKAGE" \
            "ndk;25.2.9519653"

          echo "Verificando NDK..."
          test -d "$SDK/ndk/25.2.9519653"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"

      # ==========================================
      # 4. RUST
      # ==========================================

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustup toolchain install stable
          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

          cargo ndk --version

      # ==========================================
      # 5. DIAGNÓSTICO DOS ARQUIVOS
      # ==========================================

      - name: Diagnose repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ARQUIVOS DO REPOSITÓRIO"
          echo "======================================"

          find . -type f \
            -not -path './.git/*' \
            -printf '%p (%s bytes)\n' | sort

          echo "======================================"
          echo "ARQUIVOS ZIP E PARTES"
          echo "======================================"

          find . -type f \
            -not -path './.git/*' \
            | grep -Ei '\.(zip|001|002|003)$' || true

      # ==========================================
      # 6. LOCALIZAR OU RECONSTRUIR O PROJETO
      # ==========================================

      - name: Locate and reconstruct project
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando Gradle Wrapper..."

          WRAPPER="$(find . -type f -name gradlew \
            -not -path './.git/*' \
            -print -quit || true)"

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"

            echo "Projeto já extraído: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Gradle Wrapper não encontrado."
          echo "Procurando partes do projeto..."

          mapfile -t ALL_FILES < <(
            find . -type f -not -path './.git/*' | sort
          )

          echo "Total de arquivos: ${#ALL_FILES[@]}"

          # Primeiro tenta identificar partes 01, 02 e 03.
          # Também aceita nomes como:
          # 01.zip
          # projeto-01.zip
          # ZalithLauncher2_01.zip
          # parte01.zip

          PART_FILES=()

          for PART in 01 02 03; do

            FOUND=()

            for FILE in "${ALL_FILES[@]}"; do
              BASE="$(basename "$FILE")"

              if [[ "$BASE" =~ (^|[^0-9])${PART}(\.zip)?$ ]]; then
                FOUND+=("$FILE")
              fi
            done

            if [ "${#FOUND[@]}" -ne 1 ]; then
              PART_FILES=()
              break
            fi

            PART_FILES+=("${FOUND[0]}")
          done

          # Se não encontrou 01/02/03, tenta .001/.002/.003.
          if [ "${#PART_FILES[@]}" -eq 0 ]; then

            echo "Tentando identificar partes .001, .002 e .003..."

            for SUFFIX in 001 002 003; do

              FOUND=()

              for FILE in "${ALL_FILES[@]}"; do
                BASE="$(basename "$FILE")"

                if [[ "$BASE" =~ \.zip\.${SUFFIX}$ ]] || \
                   [[ "$BASE" =~ \.${SUFFIX}$ ]]; then
                  FOUND+=("$FILE")
                fi
              done

              if [ "${#FOUND[@]}" -ne 1 ]; then
                PART_FILES=()
                break
              fi

              PART_FILES+=("${FOUND[0]}")
            done
          fi

          # Verificar se foram identificadas três partes.
          if [ "${#PART_FILES[@]}" -ne 3 ]; then

            echo "======================================"
            echo "ERRO: NÃO FOI POSSÍVEL IDENTIFICAR AS 3 PARTES"
            echo "======================================"

            echo "Arquivos encontrados no repositório:"
            printf '%s\n' "${ALL_FILES[@]}"

            echo "Nomes esperados:"
            echo "01.zip"
            echo "02.zip"
            echo "03.zip"

            echo "Ou partes:"
            echo "*.zip.001"
            echo "*.zip.002"
            echo "*.zip.003"

            echo "Verifique se os arquivos foram enviados ao GitHub."
            exit 1
          fi

          echo "======================================"
          echo "PARTES IDENTIFICADAS"
          echo "======================================"

          printf '%s\n' "${PART_FILES[@]}"

          # Reconstruir arquivo sequencial.
          mkdir -p /tmp/zalith-parts

          ARCHIVE="/tmp/zalith-parts/ZalithLauncher2.zip"
          : > "$ARCHIVE"

          for FILE in "${PART_FILES[@]}"; do
            echo "Adicionando: $FILE"
            cat "$FILE" >> "$ARCHIVE"
          done

          echo "Verificando ZIP reconstruído..."

          if ! unzip -t "$ARCHIVE"; then
            echo "ERRO: As três partes não formam um ZIP válido."
            echo "Elas precisam ser fragmentos binários do mesmo ZIP."
            exit 1
          fi

          # Extrair projeto.
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          echo "Procurando Gradle Wrapper após extração..."

          WRAPPER="$(find extracted -type f \
            -name gradlew -print -quit || true)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew não encontrado após extração."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VALIDAR PROJETO GRADLE
      # ==========================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Diretório:"
          pwd

          ls -la

          test -f gradlew

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Projeto Gradle validado."

      # ==========================================
      # 8. VERIFICAR AMBIENTE
      # ==========================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          java -version
          rustc --version
          cargo ndk --version

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          ./gradlew --version

      # ==========================================
      # 9. LISTAR TAREFAS
      # ==========================================

      - name: List Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon tasks

      # ==========================================
      # 10. COMPILAR APK
      # ==========================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          echo "Compilando Zalith Launcher 2..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # ==========================================
      # 11. LOCALIZAR APK
      # ==========================================

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              ! -name '*-androidTest.apk' \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          fi

          printf '%s\n' "${APKS[@]}"

          APK="${APKS[0]}"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 12. UPLOAD APK
      # ==========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 13. RELATÓRIOS
      # ==========================================

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Build-Reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
          
