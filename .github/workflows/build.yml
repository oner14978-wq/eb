
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zalith Launcher 2 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      JAVA_VERSION: "17"
      ANDROID_PLATFORM: "android-35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "25.2.9519653"

    steps:
      # 1. Checkout
      - name: 1 - Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Dependências Linux
      - name: 2 - Instalar dependências Linux
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            unzip zip python3 findutils file \
            curl wget git build-essential pkg-config

      # 3. Extrair arquivos do projeto
      - name: 3 - Localizar e extrair arquivos Zalith
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted/merged

          ZIP_FILE=""

          ZIP_FILE="$(find . -maxdepth 4 -type f \
            -iname 'Zali*.zip' \
            ! -path './extracted/*' \
            | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 4 -type f \
              -iname '*.zip' \
              ! -path './extracted/*' \
              | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Nenhum ZIP foi encontrado no repositório."
            find . -maxdepth 5 -type f | head -n 300
            exit 1
          fi

          echo "ZIP selecionado: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d extracted/merged

          # Extrair ZIPs internos, se existirem.
          for ROUND in 1 2 3; do
            mapfile -t INNER_ZIPS < <(
              find extracted/merged -type f -iname '*.zip'
            )

            [ "${#INNER_ZIPS[@]}" -gt 0 ] || break

            for INNER in "${INNER_ZIPS[@]}"; do
              DEST="${INNER%.zip}_extracted"

              if [ ! -d "$DEST" ]; then
                mkdir -p "$DEST"
                echo "Extraindo ZIP interno: $INNER"
                unzip -oq "$INNER" -d "$DEST"
              fi
            done
          done

          echo "===== ESTRUTURA EXTRAÍDA ====="
          find extracted/merged -maxdepth 6 -type f \
            | head -n 400

      # 4. Localizar raiz Gradle
      - name: 4 - Localizar raiz do projeto Gradle
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$(realpath extracted/merged)"
          ROOT=""

          echo "Procurando projeto em: $SEARCH_ROOT"

          # Primeira tentativa: Gradle Wrapper.
          ROOT="$(find "$SEARCH_ROOT" -type f \
            -name gradlew \
            -not -path '*/.gradle/*' \
            -printf '%h\n' \
            | head -n 1 || true)"

          # Segunda tentativa: settings.gradle.
          if [ -z "$ROOT" ]; then
            ROOT="$(find "$SEARCH_ROOT" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -printf '%h\n' \
              | head -n 1 || true)"
          fi

          # Terceira tentativa: módulo ZalithLauncher.
          if [ -z "$ROOT" ]; then
            MODULE="$(find "$SEARCH_ROOT" -type d \
              -name ZalithLauncher \
              -not -path '*/.gradle/*' \
              | head -n 1 || true)"

            if [ -n "$MODULE" ]; then
              ROOT="$(dirname "$MODULE")"
            fi
          fi

          # Quarta tentativa: build.gradle.
          if [ -z "$ROOT" ]; then
            ROOT="$(find "$SEARCH_ROOT" -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -printf '%h\n' \
              | head -n 1 || true)"
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::Não foi possível localizar a raiz Gradle."

            echo "===== ARQUIVOS ENCONTRADOS ====="
            find "$SEARCH_ROOT" -maxdepth 8 -type f \
              | head -n 500

            echo "===== PASTAS ENCONTRADAS ====="
            find "$SEARCH_ROOT" -maxdepth 7 -type d \
              | head -n 300

            echo "===== ARQUIVOS GRADLE ====="
            find "$SEARCH_ROOT" -type f \
              \( -name gradlew \
              -o -name settings.gradle \
              -o -name settings.gradle.kts \
              -o -name build.gradle \
              -o -name build.gradle.kts \)

            exit 1
          fi

          ROOT="$(realpath "$ROOT")"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "===== RAIZ ENCONTRADA ====="
          echo "$ROOT"
          ls -la "$ROOT"

      # 5. Verificar módulo principal
      - name: 5 - Verificar módulo ZalithLauncher
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PROJECT_ROOT"
          MODULE=""

          if [ -d "$ROOT/ZalithLauncher/src" ]; then
            MODULE="$ROOT/ZalithLauncher"
          elif [ -d "$ROOT/src" ] && \
               [[ "$ROOT" == *"ZalithLauncher"* ]]; then
            MODULE="$ROOT"
          else
            MODULE="$(find "$ROOT" -type d \
              -path '*/ZalithLauncher/src' \
              -printf '%h\n' | head -n 1 || true)"
          fi

          if [ -z "$MODULE" ]; then
            echo "::error::Módulo ZalithLauncher/src não encontrado."
            find "$ROOT" -maxdepth 5 -type d | head -n 300
            exit 1
          fi

          echo "MODULE_DIR=$MODULE" >> "$GITHUB_ENV"
          echo "Módulo encontrado: $MODULE"

      # 6. Java 17
      - name: 6 - Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 7. Android SDK
      - name: 7 - Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 8. Licenças
      - name: 8 - Aceitar licenças Android
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager --list_installed

      # 9. Plataformas e NDK
      - name: 9 - Instalar Android Platform e NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" \
            >> "$GITHUB_ENV"

      # 10. Rust para Android
      - name: 10 - Instalar Rust e cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

          cargo install cargo-ndk --locked

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          rustc --version
          cargo --version
          cargo ndk --version

      # 11. Corrigir Kotlin
      - name: 11 - Corrigir ColumnScope e Material3 Expressive
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          root = Path(os.environ["MODULE_DIR"])
          source_root = root / "src/main"

          dashboards = list(source_root.rglob("HomeDashboard.kt"))
          heroes = list(source_root.rglob("HomeHeroBanner.kt"))

          if not dashboards:
              print("ERRO: HomeDashboard.kt não encontrado.")
              sys.exit(1)

          if not heroes:
              print("ERRO: HomeHeroBanner.kt não encontrado.")
              sys.exit(1)

          for path in dashboards:
              source = path.read_text(encoding="utf-8")

              source = re.sub(
                  r"(?m)^\s*import\s+androidx\.compose\.foundation\.layout\.weight\s*\n",
                  "",
                  source
              )

              if "import androidx.compose.foundation.layout.ColumnScope" not in source:
                  imports = list(re.finditer(r"(?m)^import .+$", source))

                  if imports:
                      pos = imports[-1].end()
                      source = (
                          source[:pos]
                          + "\nimport androidx.compose.foundation.layout.ColumnScope"
                          + source[pos:]
                      )
                  else:
                      package = re.search(r"(?m)^package .+$", source)
                      if package:
                          pos = package.end()
                          source = (
                              source[:pos]
                              + "\n\nimport androidx.compose.foundation.layout.ColumnScope"
                              + source[pos:]
                          )
                      else:
                          source = (
                              "import androidx.compose.foundation.layout.ColumnScope\n"
                              + source
                          )

              match = re.search(r"\bfun\s+SectionCard\s*\(", source)

              if not match:
                  print(f"ERRO: declaração SectionCard não encontrada: {path}")
                  sys.exit(1)

              start = match.start()
              opening = source.find("(", match.start())
              depth = 0
              closing = -1

              for i in range(opening, len(source)):
                  if source[i] == "(":
                      depth += 1
                  elif source[i] == ")":
                      depth -= 1
                      if depth == 0:
                          closing = i
                          break

              if closing < 0:
                  print(f"ERRO: parâmetros de SectionCard inválidos: {path}")
                  sys.exit(1)

              declaration = source[start:closing + 1]

              corrected = re.sub(
                  r"content\s*:\s*@Composable\s*\(\s*\)\s*->\s*Unit",
                  "content: @Composable ColumnScope.() -> Unit",
                  declaration
              )

              if corrected == declaration and "ColumnScope.() -> Unit" not in declaration:
                  print("ERRO: formato do parâmetro content não reconhecido.")
                  print(declaration)
                  sys.exit(1)

              source = source[:start] + corrected + source[closing + 1:]
              path.write_text(source, encoding="utf-8")
              print(f"Corrigido: {path}")

          for path in heroes:
              source = path.read_text(encoding="utf-8")

              source = re.sub(
                  r"(?m)^@file:OptIn\(androidx\.compose\.material3\.ExperimentalMaterial3Api::class\)\s*\n?",
                  "",
                  source
              )

              annotation = (
                  "@file:OptIn("
                  "androidx.compose.material3.ExperimentalMaterial3ExpressiveApi::class"
                  ")"
              )

              if "ExperimentalMaterial3ExpressiveApi" not in source:
                  package = re.search(r"(?m)^package .+$", source)

                  if package:
                      pos = package.end()
                      source = (
                          source[:pos] + "\n\n" + annotation + source[pos:]
                      )
                  else:
                      source = annotation + "\n\n" + source

              path.write_text(source, encoding="utf-8")
              print(f"Opt-in corrigido: {path}")

          print("Correções Kotlin concluídas.")
          PY

      # 12. Diagnóstico
      - name: 12 - Diagnóstico dos módulos e LWJGL
        shell: bash
        run: |
          set -euo pipefail

          echo "===== MÓDULOS GRADLE ====="
          find "$PROJECT_ROOT" -maxdepth 5 \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print

          echo "===== CONFIGURAÇÃO GRADLE ====="
          find "$PROJECT_ROOT" -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print

          echo "===== LWJGL ====="
          find "$PROJECT_ROOT" -iname '*lwjgl*' -print | head -n 200

          echo "===== FONTES KOTLIN ====="
          find "$MODULE_DIR/src" -type f -name '*.kt' | wc -l

      # 13. Preparar Gradle
      - name: 13 - Preparar e verificar Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          mkdir -p ../build-logs

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            echo "Gradle Wrapper ausente. Instalando Gradle para diagnóstico."
            sudo apt-get update
            sudo apt-get install -y gradle
            GRADLE="gradle"
          fi

          java -version
          $GRADLE --version

          set +e
          $GRADLE tasks --all \
            --no-daemon \
            --stacktrace \
            2>&1 | tee ../build-logs/gradle-tasks.log

          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Falha ao listar tarefas Gradle."
            exit "$STATUS"
          fi

          echo "GRADLE_COMMAND=$GRADLE" >> "$GITHUB_ENV"

      # 14. Compilar APK
      - name: 14 - Compilar Zalith Launcher 2
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -uo pipefail

          mkdir -p ../build-logs

          GRADLE="${GRADLE_COMMAND:-./gradlew}"

          set +e
          $GRADLE :ZalithLauncher:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../build-logs/assemble-debug.log

          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::A compilação do APK falhou."

            grep -n -i -E \
              'error:|e: |failed|exception|unresolved reference' \
              ../build-logs/assemble-debug.log \
              | tail -n 150 || true

            exit "$STATUS"
          fi

          echo "Compilação concluída."

      # 15. Encontrar APK
      - name: 15 - Localizar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final-apk

          find "$PROJECT_ROOT" \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -print0 |
          while IFS= read -r -d '' APK; do
            NAME="$(basename "$APK")"
            cp "$APK" "final-apk/$NAME"
            echo "APK copiado: $NAME"
            sha256sum "final-apk/$NAME"
          done

          if ! find final-apk -type f -name '*.apk' | grep -q .; then
            echo "::error::Nenhum APK foi encontrado."
            exit 1
          fi

          ls -lh final-apk/

      # 16. Publicar APK
      - name: 16 - Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Zalith-Launcher-2-APK-Debug
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # 17. Diagnósticos
      - name: 17 - Salvar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zalith-Build-Diagnostics
          path: |
            build-logs/
            extracted/merged/
          if-no-files-found: ignore
          retention-days: 7
          
