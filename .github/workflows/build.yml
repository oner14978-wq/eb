
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Montar projeto e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. BAIXAR ARQUIVOS
      # ==========================================

      - name: Baixar arquivos do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ==========================================
      # 2. INSTALAR FERRAMENTAS
      # ==========================================

      - name: Instalar ferramentas de arquivos
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            python3 \
            findutils

      # ==========================================
      # 3. EXTRAIR E REUNIR TODOS OS ZIPs
      # ==========================================

      - name: Extrair e reunir todos os ZIPs do Zalith
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p extracted/merged
          mkdir -p zip_diagnostics

          echo "======================================"
          echo "PROCURANDO ARQUIVOS ZALI*.ZIP"
          echo "======================================"

          mapfile -d '' PARTS < <(
            find . -maxdepth 5 -type f \
              -iname 'Zali*.zip' \
              -not -path './.git/*' \
              -print0 | sort -z
          )

          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "::error::Nenhum arquivo Zali*.zip foi encontrado."
            echo "Arquivos ZIP disponíveis:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Total de arquivos: ${#PARTS[@]}"

          INDEX=0

          for PART in "${PARTS[@]}"; do
            INDEX=$((INDEX + 1))

            echo ""
            echo "======================================"
            echo "ARQUIVO ${INDEX}: $PART"
            echo "======================================"

            if ! unzip -t "$PART" \
              > "zip_diagnostics/part-${INDEX}.txt" 2>&1; then

              echo "::error::ZIP inválido ou incompleto: $PART"
              cat "zip_diagnostics/part-${INDEX}.txt"
              exit 1
            fi

            echo "ZIP válido. Reunindo arquivos..."

            unzip -oq "$PART" -d extracted/merged

          done

          echo "======================================"
          echo "EXTRAÇÃO CONCLUÍDA"
          echo "======================================"

          echo "Arquivos Gradle encontrados:"

          find extracted/merged -maxdepth 7 -type f \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -print | sort

      # ==========================================
      # 4. LOCALIZAR A RAIZ DO GRADLE
      # ==========================================

      - name: Encontrar a raiz real do projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="extracted/merged"

          echo "Procurando a raiz Gradle..."

          mapfile -t WRAPPERS < <(
            find "$ROOT" -type f -name gradlew -print | sort
          )

          PROJECT_DIR=""

          for WRAPPER in "${WRAPPERS[@]}"; do
            CANDIDATE="$(dirname "$WRAPPER")"

            if [ -f "$CANDIDATE/settings.gradle" ] || \
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then

              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Não foi encontrada uma raiz Gradle completa."

            echo "Wrappers encontrados:"
            printf '%s\n' "${WRAPPERS[@]}"

            echo "Estrutura disponível:"
            find "$ROOT" -maxdepth 7 -type f | sort | head -n 600

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then

            echo "::error::Build Gradle principal não encontrado."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Raiz do projeto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ESTRUTURA DO PROJETO"
          echo "======================================"

          find "$PROJECT_DIR" -maxdepth 4 -type d | sort

      # ==========================================
      # 5. VERIFICAR MÓDULO PRINCIPAL
      # ==========================================

      - name: Verificar módulo ZalithLauncher
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Verificando módulo principal..."

          if [ ! -d "$PROJECT_DIR/ZalithLauncher" ]; then
            echo "::error::A pasta ZalithLauncher não foi encontrada."

            find "$PROJECT_DIR" -maxdepth 5 -type d | sort
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/ZalithLauncher/src" ]; then
            echo "::error::A pasta ZalithLauncher/src não foi encontrada."

            find "$PROJECT_DIR/ZalithLauncher" -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Módulo principal encontrado."

          find "$PROJECT_DIR/ZalithLauncher/src" \
            -maxdepth 4 -type f | head -n 150

      # ==========================================
      # 6. CONFIGURAR JAVA
      # ==========================================

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 7. CONFIGURAR ANDROID SDK
      # ==========================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 8. ACEITAR LICENÇAS E INSTALAR SDK
      # ==========================================

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "ACEITANDO LICENÇAS ANDROID"
          echo "======================================"

          set +o pipefail
          yes | sdkmanager --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "::error::Falha ao aceitar licenças Android."
            exit "$SDK_STATUS"
          fi

          echo "Licenças aceitas."

          echo "======================================"
          echo "INSTALANDO COMPONENTES"
          echo "======================================"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo "Android SDK configurado."

      # ==========================================
      # 9. VERIFICAR ESTRUTURA LWJGL
      # ==========================================

      - name: Diagnosticar módulos Gradle e LWJGL
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "VERIFICANDO LWJGL"
          echo "======================================"

          if [ -d "LWJGL" ]; then
            find LWJGL -maxdepth 5 -type d | sort
            find LWJGL -maxdepth 5 -type f | sort | head -n 300
          else
            echo "::warning::Pasta LWJGL não encontrada na raiz."
          fi

          echo "======================================"
          echo "VERIFICANDO DIRETÓRIOS CONFIGURADOS"
          echo "======================================"

          if [ -f settings.gradle.kts ]; then
            grep -n -E 'LWJGL|patches|include|projectDir' \
              settings.gradle.kts || true
          elif [ -f settings.gradle ]; then
            grep -n -E 'LWJGL|patches|include|projectDir' \
              settings.gradle || true
          fi

          if [ -d "LWJGL/patches" ]; then
            echo "Diretório LWJGL/patches encontrado."
          else
            echo "::warning::LWJGL/patches continua ausente."
            echo "Não será criada uma pasta vazia para mascarar a ausência."
          fi

      # ==========================================
      # 10. VERIFICAR GRADLE
      # ==========================================

      - name: Verificar configuração Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "VERSÃO DO JAVA"
          echo "======================================"

          java -version

          echo "======================================"
          echo "VERSÃO DO GRADLE"
          echo "======================================"

          ./gradlew --version

          echo "======================================"
          echo "VERIFICANDO TAREFAS GRADLE"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks --all

      # ==========================================
      # 11. COMPILAR APK
      # ==========================================

      - name: Compilar Zalith Launcher 2
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COMPILANDO ZALITH LAUNCHER 2"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :ZalithLauncher:assembleDebug

      # ==========================================
      # 12. LOCALIZAR APK
      # ==========================================

      - name: Localizar e verificar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Procurando APK gerado..."

          mapfile -t APKS < <(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -print | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Nenhum APK foi gerado."

            find "$PROJECT_DIR" \
              -type d -path '*/build/outputs/*' -print

            exit 1
          fi

          mkdir -p final-apk

          for APK in "${APKS[@]}"; do
            echo "APK encontrado: $APK"

            ls -lh "$APK"

            cp "$APK" "final-apk/$(basename "$APK")"
          done

          echo "======================================"
          echo "APKs GERADOS"
          echo "======================================"

          ls -lh final-apk

      # ==========================================
      # 13. SALVAR APK
      # ==========================================

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Launcher-2-APK-Debug
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 14. SALVAR DIAGNÓSTICOS
      # ==========================================

      - name: Salvar diagnóstico se a compilação falhar
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Build-Diagnostics
          path: |
            zip_diagnostics/
            extracted/
          if-no-files-found: ignore
          retention-days: 7
          
