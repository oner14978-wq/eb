name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zalith Launcher 2 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      JAVA_VERSION: "17"
      ANDROID_PLATFORM: "android-35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "25.2.9519653"
      PROJECT_DIR: "ZalithLauncher"

    steps:
      # 1. Baixar o repositório
      - name: 1 - Checkout do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 2. Instalar ferramentas do sistema
      - name: 2 - Instalar dependências Linux
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            python3 \
            python3-pip \
            findutils \
            file \
            curl \
            wget \
            git \
            build-essential \
            pkg-config

      # 3. Localizar e extrair o projeto
      - name: 3 - Localizar e extrair arquivos Zalith
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted/merged

          ZIP_FILE=""

          if [ -f "ZalithLauncher2-corrigido.zip" ]; then
            ZIP_FILE="ZalithLauncher2-corrigido.zip"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f \
              -iname 'Zali*.zip' \
              ! -path './extracted/*' \
              | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Nenhum ZIP do Zalith Launcher foi encontrado."
            exit 1
          fi

          echo "Arquivo encontrado: $ZIP_FILE"
          unzip -t "$ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d extracted/merged

          echo "Arquivos extraídos:"
          find extracted/merged -maxdepth 3 -type f | head -n 100

      # 4. Encontrar a raiz Gradle
      - name: 4 - Localizar projeto Gradle
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          if [ -f "extracted/merged/gradlew" ]; then
            ROOT="extracted/merged"
          else
            ROOT="$(find extracted/merged -type f -name gradlew \
              -printf '%h\n' | head -n 1 || true)"
          fi

          if [ -z "$ROOT" ]; then
            ROOT="$(find extracted/merged -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -printf '%h\n' | head -n 1 || true)"
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::Não foi possível localizar a raiz Gradle."
            exit 1
          fi

          ROOT="$(realpath "$ROOT")"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Raiz Gradle: $ROOT"
          ls -la "$ROOT"

      # 5. Verificar módulo principal
      - name: 5 - Verificar módulo ZalithLauncher
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PROJECT_ROOT"

          if [ -d "$ROOT/ZalithLauncher/src" ]; then
            MODULE="$ROOT/ZalithLauncher"
          elif [ -d "$ROOT/src" ] && \
               [[ "$ROOT" == *"ZalithLauncher"* ]]; then
            MODULE="$ROOT"
          else
            MODULE="$(find "$ROOT" -type d \
              -path '*/ZalithLauncher/src' \
              -printf '%h\n' | head -n 1 || true)"
          fi

          if [ -z "$MODULE" ]; then
            echo "::error::Módulo ZalithLauncher/src não encontrado."
            find "$ROOT" -maxdepth 4 -type d | head -n 200
            exit 1
          fi

          echo "MODULE_DIR=$MODULE" >> "$GITHUB_ENV"
          echo "Módulo encontrado: $MODULE"
          find "$MODULE/src" -maxdepth 3 -type d | head -n 80

      # 6. Instalar Java 17
      - name: 6 - Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 7. Instalar Android SDK
      - name: 7 - Configurar Android SDK
        uses: android-actions/setup-android@v4

      # 8. Aceitar licenças
      - name: 8 - Aceitar licenças Android
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager --list_installed

      # 9. Instalar plataforma, build-tools e NDK
      - name: 9 - Instalar Android Platform e NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" \
            >> "$GITHUB_ENV"

      # 10. Configurar Rust para Android
      - name: 10 - Instalar Rust e cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

          cargo install cargo-ndk --locked

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          rustc --version
          cargo --version
          cargo ndk --version

      # 11. Corrigir fontes Kotlin
      - name: 11 - Corrigir ColumnScope e Material3 Expressive
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(__import__("os").environ["MODULE_DIR"])

          dashboard = root / "src/main/java"
          hero = root / "src/main/java"

          dashboard_files = list(dashboard.rglob("HomeDashboard.kt"))
          hero_files = list(hero.rglob("HomeHeroBanner.kt"))

          if not dashboard_files:
              print("ERRO: HomeDashboard.kt não encontrado.")
              sys.exit(1)

          if not hero_files:
              print("ERRO: HomeHeroBanner.kt não encontrado.")
              sys.exit(1)

          # Corrigir HomeDashboard.kt
          for path in dashboard_files:
              source = path.read_text(encoding="utf-8")

              # Remover import inválido de Modifier.weight.
              source = re.sub(
                  r"(?m)^\s*import\s+androidx\.compose\.foundation\.layout\.weight\s*\n",
                  "",
                  source
              )

              # Adicionar ColumnScope.
              if "import androidx.compose.foundation.layout.ColumnScope" not in source:
                  imports = list(re.finditer(r"(?m)^import .+$", source))

                  if imports:
                      pos = imports[-1].end()
                      source = (
                          source[:pos]
                          + "\nimport androidx.compose.foundation.layout.ColumnScope"
                          + source[pos:]
                      )
                  else:
                      package = re.search(r"(?m)^package .+$", source)
                      if package:
                          pos = package.end()
                          source = (
                              source[:pos]
                              + "\n\nimport androidx.compose.foundation.layout.ColumnScope"
                              + source[pos:]
                          )
                      else:
                          source = (
                              "import androidx.compose.foundation.layout.ColumnScope\n"
                              + source
                          )

              # Localizar a declaração SectionCard e corrigir o tipo
              # do lambda content para permitir Modifier.weight().
              match = re.search(
                  r"\bfun\s+SectionCard\s*\(",
                  source
              )

              if not match:
                  print(f"AVISO: SectionCard não encontrada em {path}")
                  path.write_text(source, encoding="utf-8")
                  continue

              start = match.start()
              open_paren = source.find("(", match.start())

              depth = 0
              close_paren = -1

              for index in range(open_paren, len(source)):
                  if source[index] == "(":
                      depth += 1
                  elif source[index] == ")":
                      depth -= 1
                      if depth == 0:
                          close_paren = index
                          break

              if close_paren == -1:
                  print(f"ERRO: parâmetros de SectionCard inválidos em {path}")
                  sys.exit(1)

              declaration = source[start:close_paren + 1]

              corrected = re.sub(
                  r"content\s*:\s*@Composable\s*\(\s*\)\s*->\s*Unit",
                  "content: @Composable ColumnScope.() -> Unit",
                  declaration
              )

              if corrected == declaration:
                  corrected = re.sub(
                      r"content\s*:\s*@Composable\s*\{\s*\}\s*->\s*Unit",
                      "content: @Composable ColumnScope.() -> Unit",
                      declaration
                  )

              if corrected == declaration:
                  if "ColumnScope.() -> Unit" not in declaration:
                      print(
                          "ERRO: não foi possível identificar o parâmetro "
                          "content de SectionCard."
                      )
                      print(declaration)
                      sys.exit(1)

              source = (
                  source[:start]
                  + corrected
                  + source[close_paren + 1:]
              )

              path.write_text(source, encoding="utf-8")
              print(f"Corrigido: {path}")

          # Corrigir HomeHeroBanner.kt
          for path in hero_files:
              source = path.read_text(encoding="utf-8")

              expressive_optin = (
                  "@file:OptIn("
                  "androidx.compose.material3.ExperimentalMaterial3ExpressiveApi::class"
                  ")"
              )

              # Retirar opt-in antigo incorreto, se existir.
              source = re.sub(
                  r"(?m)^@file:OptIn\(androidx\.compose\.material3\.ExperimentalMaterial3Api::class\)\s*\n?",
                  "",
                  source
              )

              if "ExperimentalMaterial3ExpressiveApi" not in source:
                  package = re.search(r"(?m)^package .+$", source)

                  if package:
                      pos = package.end()
                      source = (
                          source[:pos]
                          + "\n\n"
                          + expressive_optin
                          + source[pos:]
                      )
                  else:
                      source = expressive_optin + "\n\n" + source

              path.write_text(source, encoding="utf-8")
              print(f"Opt-in Material3 Expressive corrigido: {path}")

          print("Verificação das correções concluída.")
          PY

      # 12. Diagnóstico do projeto
      - name: 12 - Diagnóstico dos módulos e LWJGL
        shell: bash
        run: |
          set -euo pipefail

          echo "===== MÓDULOS GRADLE ====="
          find "$PROJECT_ROOT" -maxdepth 4 \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print

          echo "===== CONFIGURAÇÃO GRADLE ====="
          find "$PROJECT_ROOT" -maxdepth 3 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print

          echo "===== LWJGL ====="
          find "$PROJECT_ROOT" -iname '*lwjgl*' -print | head -n 200

          echo "===== FONTES KOTLIN ====="
          find "$MODULE_DIR/src" -type f -name '*.kt' | wc -l

      # 13. Preparar Gradle
      - name: 13 - Preparar e verificar Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          java -version
          ./gradlew --version

          mkdir -p ../build-logs

          set +e
          ./gradlew tasks --all \
            --no-daemon \
            --stacktrace \
            2>&1 | tee ../build-logs/gradle-tasks.log

          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Falha ao listar tarefas Gradle."
            exit "$STATUS"
          fi

      # 14. Compilar APK Debug
      - name: 14 - Compilar Zalith Launcher 2
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -uo pipefail

          mkdir -p ../build-logs

          echo "Iniciando compilação do APK..."

          set +e
          ./gradlew :ZalithLauncher:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee ../build-logs/assemble-debug.log

          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::A compilação do APK falhou."

            echo "===== ERROS KOTLIN E GRADLE ====="
            grep -n -i -E \
              'error:|e: |failed|exception|unresolved reference' \
              ../build-logs/assemble-debug.log \
              | tail -n 150 || true

            exit "$STATUS"
          fi

          echo "Compilação concluída."

      # 15. Localizar e preparar APK
      - name: 15 - Localizar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final-apk

          APK_FILES="$(find "$PROJECT_ROOT" \
            -type f \
            -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -print)"

          if [ -z "$APK_FILES" ]; then
            echo "::error::Nenhum APK foi encontrado."
            find "$PROJECT_ROOT" -type f -name '*.apk' -print
            exit 1
          fi

          while IFS= read -r APK; do
            [ -z "$APK" ] && continue

            NAME="$(basename "$APK")"
            DEST="final-apk/$NAME"

            cp "$APK" "$DEST"

            echo "APK copiado: $DEST"
            ls -lh "$DEST"
            sha256sum "$DEST"
          done <<< "$APK_FILES"

          echo "===== APKs FINAIS ====="
          ls -lh final-apk/

      # 16. Publicar APK
      - name: 16 - Enviar APK como artefato
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Launcher-2-APK-Debug
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # 17. Publicar diagnósticos mesmo em caso de falha
      - name: 17 - Salvar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Build-Diagnostics
          path: |
            build-logs/
            ${{ env.PROJECT_ROOT }}/build/reports/
            ${{ env.PROJECT_ROOT }}/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
