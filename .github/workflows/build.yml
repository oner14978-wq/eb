
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zalith Launcher 2
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================
      # 2. JAVA 21
      # ==========================================

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          set -euo pipefail
          java -version
          javac -version

      # ==========================================
      # 3. ANDROID SDK
      # ==========================================

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "Android SDK: $SDK"

          sdkmanager --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;25.2.9519653"

          echo "Verificando instalação..."

          test -d "$SDK/platforms/android-37.2"
          test -d "$SDK/build-tools/37.0.0"
          test -d "$SDK/ndk/25.2.9519653"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"

          echo "SDK instalado corretamente."

      # ==========================================
      # 4. RUST
      # ==========================================

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustup toolchain install stable
          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

          cargo ndk --version

      # ==========================================
      # 5. MOSTRAR ARQUIVOS
      # ==========================================

      - name: Show repository files
        shell: bash
        run: |
          set -euo pipefail

          find . -maxdepth 5 -type f \
            -not -path './.git/*' | sort

      # ==========================================
      # 6. RECONSTRUIR ZIP
      # ==========================================

      - name: Reconstruct project from ZIP parts
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando Gradle Wrapper..."

          WRAPPER="$(find . -type f -name gradlew \
            -not -path './.git/*' \
            -print -quit || true)"

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"

            echo "Projeto já extraído: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Procurando 01.zip, 02.zip e 03.zip..."

          mkdir -p /tmp/zalith-parts

          ARCHIVE="/tmp/zalith-parts/ZalithLauncher2.zip"
          : > "$ARCHIVE"

          for PART in 01 02 03; do
            FILE=""

            for CANDIDATE in "$PART.zip" "$PART"; do

              mapfile -t MATCHES < <(
                find . -maxdepth 5 -type f \
                  -name "$CANDIDATE" \
                  -not -path './.git/*'
              )

              if [ "${#MATCHES[@]}" -gt 0 ]; then
                if [ "${#MATCHES[@]}" -ne 1 ] || [ -n "$FILE" ]; then
                  echo "ERRO: Parte $PART duplicada."
                  exit 1
                fi

                FILE="${MATCHES[0]}"
              fi
            done

            if [ -z "$FILE" ]; then
              echo "ERRO: Parte $PART.zip não encontrada."
              exit 1
            fi

            echo "Adicionando: $FILE"
            cat "$FILE" >> "$ARCHIVE"
          done

          echo "Verificando integridade do ZIP..."

          unzip -t "$ARCHIVE"

          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          WRAPPER="$(find extracted -type f \
            -name gradlew -print -quit || true)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: Gradle Wrapper não encontrado."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Projeto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VERIFICAR PROJETO
      # ==========================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          pwd
          ls -la

          test -f gradlew

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERRO: settings.gradle ausente."
            exit 1
          fi

          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "Projeto Gradle validado."

      # ==========================================
      # 8. VERIFICAR AMBIENTE
      # ==========================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          echo "Java:"
          java -version

          echo "Rust:"
          rustc --version

          echo "Cargo NDK:"
          cargo ndk --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          echo "Android platform:"
          ls -la "$ANDROID_HOME/platforms/"

          echo "Gradle:"
          ./gradlew --version

      # ==========================================
      # 9. LISTAR TAREFAS
      # ==========================================

      - name: List Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon tasks

      # ==========================================
      # 10. COMPILAR APK
      # ==========================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          echo "Iniciando compilação..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # ==========================================
      # 11. LOCALIZAR APK
      # ==========================================

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              ! -name '*-androidTest.apk' \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          fi

          echo "APKs encontrados:"
          printf '%s\n' "${APKS[@]}"

          APK="${APKS[0]}"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 12. ENVIAR APK
      # ==========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 13. RELATÓRIOS
      # ==========================================

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Build-Reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
          
