
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zalith Launcher 2 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # 1. Baixar o repositório
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Instalar ferramentas necessárias
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            python3 \
            findutils \
            file

      # 3. Extrair todos os ZIPs do projeto
      - name: Extract Zalith ZIP files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted/merged
          mkdir -p zip_diagnostics

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname 'Zali*.zip' \
              -not -path '*/extracted/*' \
              -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error title=ZIP não encontrado::Nenhum arquivo ZIP Zalith foi encontrado."
            exit 1
          fi

          echo "ZIPs encontrados: ${#ZIP_FILES[@]}"

          for ZIP_FILE in "${ZIP_FILES[@]}"; do
            echo "Verificando: $(basename "$ZIP_FILE")"

            if ! unzip -t "$ZIP_FILE" >/dev/null 2>&1; then
              echo "::error title=ZIP inválido::O arquivo $(basename "$ZIP_FILE") está corrompido."
              exit 1
            fi

            unzip -oq "$ZIP_FILE" -d extracted/merged
          done

          find extracted/merged -maxdepth 3 -type f \
            | sort > zip_diagnostics/extracted-files.txt

          echo "Extração concluída."

      # 4. Encontrar a pasta principal do Gradle
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if { [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; } && \
               [ -d "$DIR/ZalithLauncher" ]; then
              PROJECT_ROOT="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted/merged" \
              -type f \
              -name gradlew \
              -print
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error title=Projeto Gradle não encontrado::Não foi encontrado um projeto com gradlew, settings e módulo ZalithLauncher."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Projeto Gradle localizado."

      # 5. Verificar estrutura do launcher
      - name: Verify Zalith Launcher source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$PROJECT_ROOT/ZalithLauncher/src" ]; then
            echo "::error title=Código-fonte ausente::ZalithLauncher/src não foi encontrado."
            exit 1
          fi

          echo "Código-fonte encontrado."
          find "$PROJECT_ROOT/ZalithLauncher/src/main" \
            -maxdepth 2 -type d | sort | sed -n '1,20p'

      # 6. Configurar Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 7. Configurar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 8. Aceitar licenças Android
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          set +o pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1
          STATUS=${PIPESTATUS[1]}

          set -o pipefail
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error title=Licenças Android::Não foi possível aceitar as licenças do Android SDK."
            exit "$STATUS"
          fi

          echo "Licenças Android aceitas."

      # 9. Instalar plataformas, ferramentas e NDK
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo "Componentes Android instalados."

      # 10. Instalar Rust e cargo-ndk
      - name: Setup Rust and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          rustup update stable
          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

          if ! cargo ndk --version >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "::error title=Android SDK ausente::O caminho do Android SDK não foi definido."
            exit 1
          fi

          NDK_PATH="$SDK_PATH/ndk/25.2.9519653"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error title=NDK ausente::NDK 25.2.9519653 não foi encontrado."
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo "Rust: $(rustc --version)"
          echo "Cargo: $(cargo --version)"
          echo "Cargo NDK: $(cargo ndk --version)"
          echo "NDK configurado."

      # 11. Corrigir imports e API experimental do Kotlin
      - name: Fix Kotlin Compose compilation issues
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_ROOT" <<'PY'
          from pathlib import Path
          import re
          import sys

          project = Path(sys.argv[1])

          root = (
              project
              / "ZalithLauncher/src/main/java/"
                "com/movtery/zalithlauncher/ui/screens/content/home"
          )

          dashboard = root / "HomeDashboard.kt"
          hero = root / "HomeHeroBanner.kt"

          for file in (dashboard, hero):
              if not file.is_file():
                  print(f"ERRO: Arquivo não encontrado: {file}")
                  sys.exit(1)

          source = dashboard.read_text(encoding="utf-8")

          weight_import = (
              "import androidx.compose.foundation.layout.weight"
          )

          if weight_import not in source:
              package_match = re.search(
                  r"^package\s+[^\n]+\n",
                  source,
                  re.MULTILINE
              )

              if not package_match:
                  print("ERRO: package não encontrado em HomeDashboard.kt.")
                  sys.exit(1)

              source = (
                  source[:package_match.end()]
                  + "\n"
                  + weight_import
                  + "\n"
                  + source[package_match.end():]
              )

              dashboard.write_text(source, encoding="utf-8")
              print("Import weight adicionado.")
          else:
              print("Import weight já existe.")

          source = hero.read_text(encoding="utf-8")

          optin = (
              "@file:OptIn("
              "androidx.compose.material3.ExperimentalMaterial3Api::class"
              ")"
          )

          if "ExperimentalMaterial3Api::class" not in source:
              package_match = re.search(
                  r"^package\s+[^\n]+\n",
                  source,
                  re.MULTILINE
              )

              if not package_match:
                  print("ERRO: package não encontrado em HomeHeroBanner.kt.")
                  sys.exit(1)

              source = (
                  source[:package_match.start()]
                  + optin
                  + "\n\n"
                  + source[package_match.start():]
              )

              hero.write_text(source, encoding="utf-8")
              print("OptIn Material 3 adicionado.")
          else:
              print("OptIn Material 3 já existe.")

          print("Verificação Kotlin concluída.")
          PY

          echo "Correções Kotlin verificadas."

      # 12. Diagnóstico do projeto
      - name: Diagnose project configuration
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Gradle root: $PROJECT_ROOT"

            echo ""
            echo "Módulos Gradle:"
            find "$PROJECT_ROOT" -maxdepth 3 \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -print | sort

            echo ""
            echo "Diretórios LWJGL:"
            find "$PROJECT_ROOT" -type d -iname '*lwjgl*' -print

            echo ""
            echo "Diretórios patches:"
            find "$PROJECT_ROOT" -type d \
              -path '*/LWJGL/patches' -print

            echo ""
            echo "Arquivos de configuração:"
            find "$PROJECT_ROOT" -maxdepth 2 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print
          } > "$GITHUB_WORKSPACE/project-diagnostics.txt"

          echo "Diagnóstico estrutural concluído."

      # 13. Preparar Gradle
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"
          chmod +x ./gradlew

          if ./gradlew \
            --no-daemon \
            --console=plain \
            tasks --all \
            > "$GITHUB_WORKSPACE/gradle-tasks.log" 2>&1; then
            echo "Gradle preparado."
          else
            STATUS=$?

            echo "::error title=Preparação Gradle falhou::Não foi possível carregar as tarefas do projeto."

            grep -n -E \
              'What went wrong:|Could not|failed|ERROR|Error:' \
              "$GITHUB_WORKSPACE/gradle-tasks.log" \
              | tail -n 10 || true

            exit "$STATUS"
          fi

      # 14. Compilar APK Debug com captura correta de erros
      - name: Build Zalith Launcher APK
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_ROOT"

          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi

          LOG="$GITHUB_WORKSPACE/build.log"

          echo "Iniciando compilação do Zalith Launcher 2..."
          echo "O log completo será salvo para diagnóstico."

          if ./gradlew \
            --no-daemon \
            --console=plain \
            --warning-mode summary \
            :ZalithLauncher:assembleDebug \
            > "$LOG" 2>&1; then

            STATUS=0
          else
            STATUS=$?
          fi

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "::error title=BUILD FAILED::A compilação do APK falhou."

            echo ""
            echo "========== RESUMO DOS ERROS =========="

            if ! grep -n -E \
              'What went wrong:|Execution failed for task|Compilation error|Unresolved reference|Type mismatch|e: file://|error:|\.kt:[0-9]+:[0-9]+' \
              "$LOG" | tail -n 20; then
              echo "Nenhuma mensagem de erro reconhecida no filtro."
            fi

            echo ""
            echo "========== CAUSA DO GRADLE =========="

            if ! grep -A 10 -E \
              'What went wrong:' "$LOG" | tail -n 15; then
              echo "O Gradle não apresentou o bloco What went wrong."
            fi

            echo ""
            echo "========== TAREFAS QUE FALHARAM =========="

            if ! grep -E \
              '^> Task .* FAILED|Execution failed for task' \
              "$LOG" | tail -n 8; then
              echo "A tarefa que falhou não foi identificada no resumo."
            fi

            echo ""
            echo "========== ÚLTIMAS LINHAS =========="
            tail -n 20 "$LOG"

            echo ""
            echo "LOG COMPLETO: Zalith-Build-Diagnostics"

            exit "$STATUS"
          fi

          echo ""
          echo "BUILD SUCCESSFUL"
          echo "APK compilado com sucesso."

      # 15. Localizar e organizar APK
      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          mapfile -t APK_FILES < <(
            find "$PROJECT_ROOT" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print | sort
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error title=APK não encontrado::A compilação terminou, mas nenhum APK Debug foi localizado."
            exit 1
          fi

          for APK in "${APK_FILES[@]}"; do
            echo "APK encontrado: $APK"

            DEST="$GITHUB_WORKSPACE/final-apk/$(basename "$APK")"

            if [ -e "$DEST" ]; then
              echo "::error title=APK duplicado::Dois APKs possuem o mesmo nome: $(basename "$APK")"
              exit 1
            fi

            cp "$APK" "$DEST"
          done

          echo ""
          echo "APKs gerados:"
          ls -lh "$GITHUB_WORKSPACE/final-apk"

      # 16. Enviar APK como artefato - Node.js 24
      - name: Upload Zalith Launcher APK
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Launcher-2-APK-Debug
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # 17. Enviar diagnósticos em caso de falha - Node.js 24
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Zalith-Build-Diagnostics
          path: |
            build.log
            gradle-tasks.log
            project-diagnostics.txt
            zip_diagnostics/
          if-no-files-found: warn
          retention-days: 7
          
