name: Build Zalith Launcher 2 APK

# ---------------------------------------------------------------------------
# Compila o Zalith Launcher 2 a partir dos 22 pacotes ZIP guardados no
# repositório (Zali-03.zip ... ZalithLa-19.zip), verifica tudo antes e depois
# de corrigir, e publica o APK como Artifact da execução.
#
# Os pacotes NÃO são extraídos dentro do repositório: vão para
# /home/runner/zalith-src, então os workflows internos dos ZIPs
# (.github/workflows/*) nunca ficam ativos nem conflitam com este arquivo.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Arquitetura do APK (all = universal, maior)"
        required: true
        default: "all"
        type: choice
        options: ["all", "arm64", "arm", "x86", "x86_64"]
      build_type:
        description: "auto = Debug sempre + Release se houver secrets de assinatura"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "debug", "release", "both"]
  push:
    branches: ["**"]

concurrency:
  group: zalith-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPORT_DIR: /tmp/zreport
  SRC_ROOT: /home/runner/zalith-src
  ARCH: ${{ github.event.inputs.arch || 'all' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'auto' }}

jobs:
  build:
    name: Verificar, corrigir e compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      # ---------------------------------------------------------------- 0
      - name: Checkout do repositório
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Liberar espaço em disco e preparar relatório
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          mkdir -p "$REPORT_DIR" "$SRC_ROOT"
          : > "$REPORT_DIR/problems.txt"
          : > "$REPORT_DIR/fixed.txt"
          df -h / | tail -1

      # ---------------------------------------------------------------- 1
      - name: "Verificação 1/4 - localizar e testar os arquivos ZIP"
        run: |
          set -uo pipefail
          ZIPS=(
            Zali-03.zip Zalit-04.zip Zalit-05.zip Zalit-06.zip Zalit-08.zip
            Zalit-10.zip Zalit-18.zip Zalith-01.zip Zalith-02.zip Zalith-09.zip
            Zalith-12.zip Zalith-13.zip Zalith-20.zip ZalithL-14.zip ZalithL-15.zip
            ZalithL-16.zip ZalithL-21.zip ZalithL-22.zip ZalithLa-07.zip
            ZalithLa-11.zip ZalithLa-17.zip ZalithLa-19.zip
          )
          expected=${#ZIPS[@]}; found=0; ok=0
          : > "$REPORT_DIR/zips.txt"

          find_one() { # procura na raiz e em subpastas; prefere o caminho mais curto
            find "$GITHUB_WORKSPACE" -type f -name "$1" -not -path '*/.git/*' 2>/dev/null \
              | awk '{ print length($0) "\t" $0 }' | sort -n | cut -f2-
          }

          for n in "${ZIPS[@]}"; do
            mapfile -t hits < <(find_one "$n")
            if [ "${#hits[@]}" -eq 0 ]; then
              echo "::error::ZIP ausente no repositório: $n"
              echo "ZIP ausente: $n" >> "$REPORT_DIR/problems.txt"; continue
            fi
            found=$((found+1))
            f="${hits[0]}"
            [ "${#hits[@]}" -gt 1 ] && echo "::warning::$n aparece ${#hits[@]}x; usando $f"
            size=$(stat -c %s "$f")
            magic=$(head -c2 "$f" 2>/dev/null)
            if [ "$size" -lt 1024 ] || [ "$magic" != "PK" ]; then
              echo "::error::$n não é um ZIP válido (tamanho=$size). Se o repositório usa Git LFS, confirme que os arquivos foram baixados."
              echo "ZIP inválido/ponteiro LFS: $n ($size bytes)" >> "$REPORT_DIR/problems.txt"; continue
            fi
            if ! unzip -tqq "$f" >/dev/null 2>&1; then
              echo "::error::Falha no teste de integridade: $n"
              echo "ZIP corrompido: $n" >> "$REPORT_DIR/problems.txt"; continue
            fi
            entries=$(unzip -Z1 "$f" | grep -vc '/$' || true)
            printf 'OK  %-18s %10s bytes  %5s arquivos  (%s)\n' "$n" "$size" "$entries" "${f#$GITHUB_WORKSPACE/}"
            echo "$f" >> "$REPORT_DIR/zips.txt"
            ok=$((ok+1))
          done

          # LEIA-ME: o nome pedido é LEIA-ME.72; o arquivo real do pacote chama-se LEIA-ME.7z
          readme=""
          for cand in "LEIA-ME.72" "LEIA-ME.7z" "LEIA-ME*"; do
            r=$(find_one "$cand" | head -1); [ -n "$r" ] && { readme="$r"; break; }
          done
          if [ -n "$readme" ]; then
            echo "$readme" > "$REPORT_DIR/readme_path.txt"
            [ "$(basename "$readme")" != "LEIA-ME.72" ] && \
              echo "::notice::'LEIA-ME.72' não existe; usando '$(basename "$readme")' (provável erro de digitação no nome)."
          else
            echo "::warning::LEIA-ME não encontrado (não é necessário para compilar)."
            echo "LEIA-ME não encontrado (opcional)" >> "$REPORT_DIR/problems.txt"
          fi

          {
            echo "ZIPS_EXPECTED=$expected"
            echo "ZIPS_FOUND=$found"
            echo "ZIPS_OK=$ok"
          } >> "$GITHUB_ENV"
          echo "ZIPs esperados=$expected encontrados=$found aprovados=$ok"
          [ "$ok" -eq "$expected" ] || { echo "::error::Nem todos os ZIPs passaram na verificação."; exit 1; }

      - name: Ler o LEIA-ME (informativo)
        continue-on-error: true
        run: |
          [ -f "$REPORT_DIR/readme_path.txt" ] || exit 0
          f=$(cat "$REPORT_DIR/readme_path.txt")
          command -v 7z >/dev/null 2>&1 || sudo apt-get install -y -qq p7zip-full >/dev/null
          mkdir -p /tmp/leiame && 7z x -y -p"" -o/tmp/leiame "$f" >/dev/null 2>&1 \
            || 7z x -y -o/tmp/leiame "$f" >/dev/null 2>&1 \
            || { echo "::warning::Não foi possível abrir $f"; exit 0; }
          echo "----- conteúdo de $(basename "$f") -----"
          find /tmp/leiame -type f -exec sh -c 'echo "## $1"; head -c 4000 "$1"; echo' _ {} \;

      # ---------------------------------------------------------------- 2
      - name: "Verificação 2/4 - extrair para estrutura organizada e detectar conflitos"
        run: |
          python3 - <<'PY'
          import os, sys, zipfile, collections
          src = os.environ["SRC_ROOT"]; rep = os.environ["REPORT_DIR"]
          zips = [l.strip() for l in open(f"{rep}/zips.txt") if l.strip()]
          zips.sort(key=lambda p: os.path.basename(p))
          owners = collections.defaultdict(list)
          for z in zips:
              with zipfile.ZipFile(z) as zf:
                  for i in zf.infolist():
                      if i.is_dir() or i.filename.startswith("__MACOSX/"):
                          continue
                      owners[i.filename].append((z, i.CRC, i.file_size))
          unsafe = [n for n in owners if n.startswith("/") or ".." in n.split("/")]
          if unsafe:
              print("::error::Caminhos inseguros nos ZIPs:", unsafe[:5]); sys.exit(1)
          same = {n: v for n, v in owners.items() if len(v) > 1 and len({c for _, c, _ in v}) == 1}
          diff = {n: v for n, v in owners.items() if len({c for _, c, _ in v}) > 1}
          lower = collections.defaultdict(set)
          for n in owners: lower[n.lower()].add(n)
          case = {k: v for k, v in lower.items() if len(v) > 1}
          print(f"arquivos únicos: {len(owners)} | duplicados idênticos: {len(same)} | "
                f"conflitos de conteúdo: {len(diff)} | colisões de maiúsculas: {len(case)}")
          with open(f"{rep}/problems.txt", "a") as pf, open(f"{rep}/fixed.txt", "a") as ff:
              for n, v in list(diff.items())[:50]:
                  msg = f"Conflito de conteúdo em {n}: " + ", ".join(os.path.basename(z) for z, _, _ in v)
                  print("::warning::" + msg + " -> prevalece o último pacote (ordem alfabética)")
                  pf.write(msg + "\n"); ff.write(f"Conflito {n}: mantido o do último pacote\n")
              for k, v in case.items():
                  pf.write(f"Colisão de maiúsculas/minúsculas: {sorted(v)}\n")
          total = 0
          for z in zips:
              with zipfile.ZipFile(z) as zf:
                  for i in zf.infolist():
                      if i.filename.startswith("__MACOSX/"):
                          continue
                      dest = os.path.join(src, i.filename)
                      if i.is_dir():
                          os.makedirs(dest, exist_ok=True); continue
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      with zf.open(i) as r, open(dest, "wb") as w:
                          while True:
                              b = r.read(1 << 20)
                              if not b: break
                              w.write(b)
                      mode = (i.external_attr >> 16) & 0o777
                      if mode: os.chmod(dest, mode)
                      total += 1
          print(f"extraídos {total} arquivos para {src}")
          open(os.environ["GITHUB_ENV"], "a").write(f"FILES_EXTRACTED={total}\n")
          PY      - name: "Verificação do catálogo de dependências (libs.*)"
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import os, re, sys, glob
          try:
              import tomllib
          except ImportError:
              sys.exit(0)
          t = tomllib.load(open("gradle/libs.versions.toml", "rb"))
          norm = lambda s: s.replace("-", ".").replace("_", ".")
          libs = {norm(k) for k in t.get("libraries", {})}
          plugs = {norm(k) for k in t.get("plugins", {})}
          bundles = {norm(k) for k in t.get("bundles", {})}
          bad = []
          for f in glob.glob("**/build.gradle*", recursive=True) + ["build.gradle.kts"]:
              if not os.path.isfile(f): continue
              s = open(f, encoding="utf-8", errors="ignore").read()
              for m in re.finditer(r"libs\.plugins\.([A-Za-z0-9_.]+)", s):
                  if not any(m.group(1) == p or m.group(1).startswith(p + ".") for p in plugs): bad.append((f, m.group(0)))
              for m in re.finditer(r"libs\.(?!plugins|versions)([A-Za-z0-9_.]+)", s):
                  a = m.group(1)
                  if not (any(a == l or a.startswith(l + ".") for l in libs) or any(a.startswith(b) for b in bundles)):
                      bad.append((f, m.group(0)))
          print("aliases ausentes:", bad or "nenhum")
          sys.exit(1 if bad else 0)
          PY

      - name: "Segunda verificação (após as correções)"
        run: |
          cd "$PROJECT_DIR"
          fail=0
          if ! test -x gradlew; then
            echo "::error::gradlew continua sem permissão"
            fail=1
          fi
          for f in gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$APP_DIR/src/main/AndroidManifest.xml"; do
            if [ ! -f "$f" ]; then
              echo "::error::arquivo ausente: $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Segunda verificação FALHOU" >> "$REPORT_DIR/problems.txt"
            exit 1
          fi
          echo "Segunda verificação OK"

      - name: Instalar JDKs necessários
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_LIST }}

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        if: env.NDK_VERSION != ''
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Instalar Rust (se o projeto usar)
        if: env.HAS_RUST == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decidir tipos de build
        run: |
          debug=false; release=false
          has_secrets=false
          if [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then has_secrets=true; fi
          case "$BUILD_TYPE" in
            debug)   debug=true ;;
            release) release=true ;;
            both)    debug=true; release=true ;;
            *)       debug=true; [ "$has_secrets" = "true" ] && release=true ;;
          esac
          if [ "$release" = "true" ] && [ "$has_secrets" != "true" ]; then
            echo "::warning::Release pedido, mas faltam STORE_PASSWORD/KEY_PASSWORD. Release será ignorado."
            echo "Release ignorado: secrets de assinatura ausentes" >> "$REPORT_DIR/problems.txt"
            release=false
          fi
          echo "BUILD_DEBUG=$debug" >> "$GITHUB_ENV"
          echo "BUILD_RELEASE=$release" >> "$GITHUB_ENV"
          echo "Debug=$debug Release=$release"

      - name: Compilar Debug
        if: env.BUILD_DEBUG == 'true'
        run: |
          cd "$PROJECT_DIR"
          ./gradlew "${APP_PATH}:assembleDebug" --stacktrace --no-daemon

      - name: Compilar Release
        if: env.BUILD_RELEASE == 'true'
        run: |
          cd "$PROJECT_DIR"
          ./gradlew "${APP_PATH}:assembleRelease" --stacktrace --no-daemon

      - name: Coletar APKs
        if: always()
        run: |
          mkdir -p /tmp/apks
          cd "$PROJECT_DIR/$APP_DIR"
          find build/outputs/apk -type f -name '*.apk' 2>/dev/null | while read -r f; do
            name=$(basename "$f")
            if [ "$ARCH" != "all" ]; then
              case "$name" in
                *"$ARCH"*) ;;
                *universal*) ;;
                *) continue ;;
              esac
            fi
            cp "$f" "/tmp/apks/$name"
          done
          ls -lh /tmp/apks || true
          if [ -z "$(ls -A /tmp/apks 2>/dev/null)" ]; then
            echo "::warning::Nenhum APK encontrado para a arquitetura '$ARCH'."
          fi

      - name: Publicar APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-APK-${{ env.ARCH }}
          path: /tmp/apks/*.apk
          if-no-files-found: warn

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-verificacao
          path: /tmp/zreport/
          if-no-files-found: ignore

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Resumo da execução"
            echo "- ZIPs esperados/encontrados/aprovados: ${ZIPS_EXPECTED:-?}/${ZIPS_FOUND:-?}/${ZIPS_OK:-?}"
            echo "- Arquivos extraídos: ${FILES_EXTRACTED:-?}"
            echo "- Gradle ${GRADLE_VERSION:-?} | AGP ${AGP_VERSION:-?} | JDK ${JDK_MAIN:-?}"
            echo "### Problemas"
            cat "$REPORT_DIR/problems.txt" 2>/dev/null || true
            echo "### Correções automáticas"
            cat "$REPORT_DIR/fixed.txt" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
``
