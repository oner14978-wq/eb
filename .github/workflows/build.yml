
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zalith Launcher 2
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. BAIXAR O REPOSITÓRIO
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================
      # 2. INSTALAR JAVA 21
      # ==========================================

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          set -euo pipefail
          java -version
          javac -version

      # ==========================================
      # 3. INSTALAR ANDROID SDK
      # ==========================================

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK: $ANDROID_SDK_ROOT"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;25.2.9519653"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      # ==========================================
      # 4. INSTALAR RUST
      # ==========================================

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustup toolchain install stable
          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

          cargo ndk --version

      # ==========================================
      # 5. VERIFICAR ARQUIVOS
      # ==========================================

      - name: Show repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos disponíveis:"
          find . -maxdepth 5 -type f \
            -not -path './.git/*' | sort

      # ==========================================
      # 6. IDENTIFICAR OU RECONSTRUIR O PROJETO
      # ==========================================

      - name: Reconstruct project from 01.zip 02.zip 03.zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Procurando Gradle Wrapper..."

          WRAPPER="$(find . -type f -name gradlew \
            -not -path './.git/*' \
            -print -quit || true)"

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"

            echo "Projeto já extraído: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Procurando as partes 01.zip, 02.zip e 03.zip..."

          mkdir -p /tmp/zalith-parts

          ARCHIVE="/tmp/zalith-parts/ZalithLauncher2.zip"
          : > "$ARCHIVE"

          for PART in 01 02 03; do

            FILE=""

            for CANDIDATE in "$PART.zip" "$PART"; do

              mapfile -t MATCHES < <(
                find . -maxdepth 5 -type f \
                  -name "$CANDIDATE" \
                  -not -path './.git/*'
              )

              if [ "${#MATCHES[@]}" -gt 0 ]; then

                if [ "${#MATCHES[@]}" -ne 1 ] || [ -n "$FILE" ]; then
                  echo "ERRO: Arquivo $PART duplicado."
                  exit 1
                fi

                FILE="${MATCHES[0]}"
              fi

            done

            if [ -z "$FILE" ]; then
              echo "ERRO: Parte $PART.zip não encontrada."
              exit 1
            fi

            echo "Reconstruindo com: $FILE"
            cat "$FILE" >> "$ARCHIVE"

          done

          # Verificar integridade antes da extração
          echo "Verificando arquivo reconstruído..."

          if ! unzip -t "$ARCHIVE"; then
            echo "ERRO: As três partes não formam um ZIP válido."
            echo "Confirme que são fragmentos binários sequenciais."
            exit 1
          fi

          # Extrair projeto
          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          # Encontrar Gradle Wrapper
          WRAPPER="$(find extracted -type f \
            -name gradlew -print -quit || true)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: Gradle Wrapper não encontrado."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Projeto localizado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VALIDAR PROJETO GRADLE
      # ==========================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Diretório:"
          pwd

          ls -la

          if [ ! -f gradlew ]; then
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERRO: gradle-wrapper.properties não encontrado."
            exit 1
          fi

          chmod +x gradlew

          echo "Projeto Gradle validado."

      # ==========================================
      # 8. VERIFICAR RUST E GRADLE
      # ==========================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          java -version
          rustc --version
          cargo --version
          cargo ndk --version

          ./gradlew --version

      # ==========================================
      # 9. LISTAR TAREFAS GRADLE
      # ==========================================

      - name: List Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon tasks

      # ==========================================
      # 10. COMPILAR APK
      # ==========================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          echo "Iniciando compilação do Zalith Launcher 2..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # ==========================================
      # 11. LOCALIZAR APK
      # ==========================================

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              ! -name '*-androidTest.apk' \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APKs encontrados:"
          printf '%s\n' "${APKS[@]}"

          APK="${APKS[0]}"

          echo "APK_PATH=$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 12. ENVIAR APK
      # ==========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 13. ENVIAR RELATÓRIOS
      # ==========================================

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Build-Reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
          
