
name: Build Zalith Launcher 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Reconstruct and Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;25.2.9519653"

      - name: Install Rust and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustup toolchain install stable
          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Reconstruct project from 01.zip, 02.zip and 03.zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking whether the project is already extracted..."

          WRAPPER="$(find . -type f -name gradlew \
            -not -path './.git/*' -print -quit || true)"

          if [ -n "$WRAPPER" ]; then
            echo "Gradle Wrapper already found: $WRAPPER"
            PROJECT_DIR="$(dirname "$WRAPPER")"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Looking for the three ZIP parts..."

          PART_DIR="/tmp/zalith-parts"
          mkdir -p "$PART_DIR"

          ARCHIVE="$PART_DIR/ZalithLauncher2.zip"
          : > "$ARCHIVE"

          for PART in 01 02 03; do
            FILE=""

            for CANDIDATE in "$PART.zip" "$PART"; do
              MATCHES="$(find . -maxdepth 5 -type f \
                -name "$CANDIDATE" \
                -not -path './.git/*')"

              if [ -n "$MATCHES" ]; then
                COUNT="$(printf '%s\n' "$MATCHES" | wc -l)"

                if [ "$COUNT" -ne 1 ] || [ -n "$FILE" ]; then
                  echo "ERROR: Duplicate or ambiguous part: $PART"
                  exit 1
                fi

                FILE="$MATCHES"
              fi
            done

            if [ -z "$FILE" ]; then
              echo "ERROR: Missing file $PART.zip"
              echo "Files found in repository:"
              find . -maxdepth 5 -type f
              exit 1
            fi

            echo "Adding part $PART: $FILE"
            cat "$FILE" >> "$ARCHIVE"
          done

          echo "Checking reconstructed archive..."

          if ! unzip -t "$ARCHIVE"; then
            echo "ERROR: The three parts do not form a valid ZIP."
            echo "Check that they are sequential binary parts of the same ZIP."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          echo "Searching for Gradle Wrapper..."

          WRAPPER="$(find extracted -type f -name gradlew \
            -print -quit || true)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found after extraction."
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          chmod +x "$WRAPPER"

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project root:"
          pwd

          echo "Project files:"
          ls -la

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle Wrapper not found."
            exit 1
          fi

          echo "Gradle Wrapper verified."

      - name: Show Gradle tasks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon tasks

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          source "$HOME/.cargo/env"

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher2-Build-Logs
          path: |
            ${{ github.workspace }}/**/build/reports/
          if-no-files-found: ignore
          retention-days: 7
          
