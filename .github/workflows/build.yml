
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Reconstruct and Build Zalith Launcher 2
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================
      # 2. JAVA 21
      # ==========================================

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version

      # ==========================================
      # 3. ANDROID SDK
      # ==========================================

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "Android SDK: $SDK"

          sdkmanager --list > /tmp/sdk-list.txt

          echo "Plataformas Android 37 disponíveis:"
          grep -E 'platforms;android-37' /tmp/sdk-list.txt || true

          PLATFORM_PACKAGE="$(
            grep -oE 'platforms;android-37[^[:space:]]*' \
              /tmp/sdk-list.txt |
            sort -u |
            head -n 1 || true
          )"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERRO: Plataforma Android 37 não encontrada."
            grep -E 'platforms;android-' /tmp/sdk-list.txt || true
            exit 1
          fi

          echo "Instalando plataforma: $PLATFORM_PACKAGE"

          sdkmanager --install \
            "platform-tools" \
            "$PLATFORM_PACKAGE" \
            "ndk;25.2.9519653"

          test -d "$SDK/ndk/25.2.9519653"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"

      # ==========================================
      # 4. RUST
      # ==========================================

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustup toolchain install stable
          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

          cargo ndk --version

      # ==========================================
      # 5. DIAGNÓSTICO DOS ARQUIVOS
      # ==========================================

      - name: Diagnose repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ARQUIVOS DO REPOSITÓRIO"
          echo "======================================"

          find . -type f \
            -not -path './.git/*' \
            -printf '%p (%s bytes)\n' |
            sort

          echo "======================================"
          echo "PARTES DO ZALITH"
          echo "======================================"

          for FILE in \
            "./Zalith-01.zip" \
            "./Zalith-02.zip" \
            "./Zali-03.zip"
          do
            if [ -f "$FILE" ]; then
              ls -lh "$FILE"
              file "$FILE"
            else
              echo "AUSENTE: $FILE"
            fi
          done

      # ==========================================
      # 6. EXTRAÇÃO INTELIGENTE DAS PARTES
      # ==========================================

      - name: Reconstruct and extract project
        shell: bash
        run: |
          set -euo pipefail

          PARTS=(
            "./Zalith-01.zip"
            "./Zalith-02.zip"
            "./Zali-03.zip"
          )

          echo "Procurando Gradle Wrapper..."

          WRAPPER="$(
            find . -type f \
              -name gradlew \
              -not -path './.git/*' \
              -print -quit || true
          )"

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
            echo "Projeto já existe: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Gradle Wrapper não encontrado."
          echo "Verificando as partes..."

          for FILE in "${PARTS[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "ERRO: Arquivo ausente ou vazio: $FILE"
              exit 1
            fi
          done

          rm -rf extracted
          mkdir -p extracted

          export PART1="${PARTS[0]}"
          export PART2="${PARTS[1]}"
          export PART3="${PARTS[2]}"

          python3 <<'PY'
          import os
          import sys
          import zipfile
          from pathlib import Path

          parts = [
              Path(os.environ["PART1"]),
              Path(os.environ["PART2"]),
              Path(os.environ["PART3"]),
          ]

          destination = Path("extracted").resolve()
          destination.mkdir(parents=True, exist_ok=True)

          independent = True

          print("======================================")
          print("ANALISANDO CADA PARTE")
          print("======================================")

          for part in parts:
              print(f"\nArquivo: {part}")
              print(f"Tamanho: {part.stat().st_size} bytes")

              try:
                  with zipfile.ZipFile(part, "r") as archive:
                      entries = archive.infolist()

                      if not entries:
                          independent = False
                          print("ZIP sem arquivos.")
                          continue

                      damaged = archive.testzip()

                      if damaged:
                          raise RuntimeError(
                              f"Arquivo danificado: {damaged}"
                          )

                      print(f"ZIP independente válido: {len(entries)} entradas")

                      for entry in entries[:40]:
                          print("  " + entry.filename)

              except zipfile.BadZipFile:
                  independent = False
                  print("Não é um ZIP independente.")

          def safe_extract(archive, target):
              root = target.resolve()

              for entry in archive.infolist():
                  output = (root / entry.filename).resolve()

                  if output != root and root not in output.parents:
                      raise RuntimeError(
                          "Caminho inseguro no ZIP: " + entry.filename
                      )

              archive.extractall(root)

          if independent:
              print("\n======================================")
              print("MODO: EXTRAINDO ZIPs SEPARADAMENTE")
              print("======================================")

              for part in parts:
                  print(f"\nExtraindo {part}...")

                  with zipfile.ZipFile(part, "r") as archive:
                      safe_extract(archive, destination)

          else:
              print("\n======================================")
              print("MODO: RECONSTRUINDO FRAGMENTOS")
              print("======================================")

              combined = Path(
                  "/tmp/ZalithLauncher2-combined.zip"
              )

              with combined.open("wb") as output:
                  for part in parts:
                      print("Adicionando:", part)

                      with part.open("rb") as source:
                          while True:
                              block = source.read(1024 * 1024)

                              if not block:
                                  break

                              output.write(block)

              print("Arquivo reconstruído:", combined)
              print("Tamanho:", combined.stat().st_size)

              with zipfile.ZipFile(combined, "r") as archive:
                  damaged = archive.testzip()

                  if damaged:
                      raise RuntimeError(
                          "ZIP reconstruído danificado: " + damaged
                      )

                  print("Entradas encontradas:", len(archive.infolist()))
                  safe_extract(archive, destination)

          print("\nExtração concluída.")
          PY

          # ======================================
          # PROCURAR PROJETO GRADLE
          # ======================================

          echo "======================================"
          echo "PROCURANDO PROJETO GRADLE"
          echo "======================================"

          find extracted -type f \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name gradle-wrapper.properties \) \
            -print

          WRAPPER="$(
            find extracted -type f \
              -name gradlew \
              -print -quit || true
          )"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew não encontrado."

            echo "Estrutura extraída:"
            find extracted -maxdepth 8 -type f -print | sort

            echo "Pastas extraídas:"
            find extracted -maxdepth 5 -type d -print | sort

            echo "Arquivos de configuração Gradle:"
            find extracted -type f \
              \( -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name 'gradle-wrapper.properties' \) \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VALIDAR PROJETO GRADLE
      # ==========================================

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Diretório do projeto:"
          pwd

          echo "Arquivos:"
          ls -la

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERRO: Projeto Gradle inválido."
            exit 1
          fi

          chmod +x gradlew

          echo "Projeto Gradle validado."

      # ==========================================
      # 8. VERIFICAR FERRAMENTAS
      # ==========================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          echo "Java:"
          java -version

          echo "Rust:"
          rustc --version

          echo "Cargo NDK:"
          cargo ndk --version

          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Android NDK: $ANDROID_NDK_HOME"

          echo "Gradle:"
          ./gradlew --version

      # ==========================================
      # 9. LISTAR TAREFAS GRADLE
      # ==========================================

      - name: List Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --no-daemon tasks

      # ==========================================
      # 10. COMPILAR APK
      # ==========================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          cd "$PROJECT_DIR"

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          echo "======================================"
          echo "COMPILANDO ZALITH LAUNCHER 2"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # ==========================================
      # 11. LOCALIZAR APK
      # ==========================================

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              ! -name '*-androidTest.apk' |
            sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERRO: Nenhum APK encontrado."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APKs encontrados:"
          printf '%s\n' "${APKS[@]}"

          APK="${APKS[0]}"

          echo "APK selecionado: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 12. PUBLICAR APK
      # ==========================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 13. RELATÓRIOS
      # ==========================================

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ZalithLauncher2-Build-Reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
          
