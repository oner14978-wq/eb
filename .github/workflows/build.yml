
name: Zalith Launcher 2 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Zalith Launcher 2 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # 1. Baixar o repositório
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Instalar ferramentas necessárias
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            python3 \
            findutils \
            file

      # 3. Extrair todos os ZIPs do projeto
      - name: Extract Zalith ZIP files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted/merged
          mkdir -p zip_diagnostics

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname 'Zali*.zip' \
              -not -path '*/extracted/*' \
              -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERRO: Nenhum ZIP Zalith foi encontrado."
            exit 1
          fi

          echo "ZIPs encontrados:"
          printf '%s\n' "${ZIP_FILES[@]}"

          for ZIP_FILE in "${ZIP_FILES[@]}"; do
            echo ""
            echo "Verificando: $ZIP_FILE"

            if ! unzip -t "$ZIP_FILE"; then
              echo "ZIP inválido: $ZIP_FILE"
              exit 1
            fi

            unzip -o "$ZIP_FILE" -d extracted/merged
          done

          find extracted/merged -maxdepth 3 -type f \
            | sort > zip_diagnostics/extracted-files.txt

          echo "Extração concluída."

      # 4. Encontrar a pasta principal do Gradle
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/gradlew" ] && \
               { [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; }; then
              PROJECT_ROOT="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted/merged" \
              -type f \
              -name gradlew \
              -print
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERRO: Projeto Gradle não encontrado."
            find extracted/merged -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_ROOT"

      # 5. Verificar estrutura do launcher
      - name: Verify Zalith Launcher source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$PROJECT_ROOT/ZalithLauncher/src" ]; then
            echo "ERRO: ZalithLauncher/src não encontrado."
            find "$PROJECT_ROOT" -maxdepth 4 -type d | sort
            exit 1
          fi

          echo "Código-fonte encontrado."
          ls -la "$PROJECT_ROOT/ZalithLauncher/src/main"

      # 6. Configurar Java
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 7. Configurar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 8. Aceitar licenças
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          set +o pipefail

          yes | sdkmanager --licenses
          STATUS=${PIPESTATUS[1]}

          set -o pipefail
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "Falha ao aceitar licenças Android SDK."
            exit "$STATUS"
          fi

      # 9. Instalar plataformas, ferramentas e NDK
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

      # 10. Instalar Rust e cargo-ndk
      - name: Setup Rust and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          rustup update stable
          rustup default stable

          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "Android SDK não encontrado."
            exit 1
          fi

          NDK_PATH="$SDK_PATH/ndk/25.2.9519653"

          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK não encontrado: $NDK_PATH"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          rustc --version
          cargo --version
          cargo-ndk --version

      # 11. Corrigir imports e API experimental do Kotlin
      - name: Fix Kotlin Compose compilation issues
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("extracted/merged/ZalithLauncher/src/main/java/com/movtery/zalithlauncher/ui/screens/content/home")

          dashboard = root / "HomeDashboard.kt"
          hero = root / "HomeHeroBanner.kt"

          for file in (dashboard, hero):
              if not file.is_file():
                  print(f"ERRO: Arquivo não encontrado: {file}")
                  sys.exit(1)

          # HomeDashboard.kt:
          # Adiciona o import de weight somente se ainda não existir.
          source = dashboard.read_text(encoding="utf-8")

          weight_import = "import androidx.compose.foundation.layout.weight"

          if weight_import not in source:
              package_match = re.search(r"^package\s+[^\n]+\n", source, re.MULTILINE)

              if not package_match:
                  print("ERRO: Declaração package não encontrada em HomeDashboard.kt.")
                  sys.exit(1)

              source = (
                  source[:package_match.end()]
                  + "\n"
                  + weight_import
                  + "\n"
                  + source[package_match.end():]
              )

              dashboard.write_text(source, encoding="utf-8")
              print("Import weight adicionado em HomeDashboard.kt.")
          else:
              print("Import weight já existe.")

          # HomeHeroBanner.kt:
          # Autoriza a API experimental do Material 3 no arquivo.
          source = hero.read_text(encoding="utf-8")

          optin = (
              "@file:OptIn("
              "androidx.compose.material3.ExperimentalMaterial3Api::class"
              ")"
          )

          if optin not in source:
              package_match = re.search(r"^package\s+[^\n]+\n", source, re.MULTILINE)

              if not package_match:
                  print("ERRO: Declaração package não encontrada em HomeHeroBanner.kt.")
                  sys.exit(1)

              source = (
                  optin
                  + "\n\n"
                  + source
              )

              hero.write_text(source, encoding="utf-8")
              print("OptIn Material 3 adicionado em HomeHeroBanner.kt.")
          else:
              print("OptIn Material 3 já existe.")

          print("Verificação das alterações concluída.")
          PY

          echo "Verificando alterações:"
          grep -n "foundation.layout.weight" \
            "$PROJECT_ROOT/ZalithLauncher/src/main/java/com/movtery/zalithlauncher/ui/screens/content/home/HomeDashboard.kt" || true

          grep -n "ExperimentalMaterial3Api" \
            "$PROJECT_ROOT/ZalithLauncher/src/main/java/com/movtery/zalithlauncher/ui/screens/content/home/HomeHeroBanner.kt" || true

      # 12. Diagnóstico de LWJGL e configurações
      - name: Diagnose project configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Gradle root: $PROJECT_ROOT"

          echo "Módulos:"
          find "$PROJECT_ROOT" -maxdepth 3 \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print | sort

          echo "Diretórios LWJGL:"
          find "$PROJECT_ROOT" -type d -iname '*lwjgl*' -print

          echo "Verificação de patches:"
          find "$PROJECT_ROOT" -type d -path '*/LWJGL/patches' -print

          echo "Configurações Gradle:"
          find "$PROJECT_ROOT" -maxdepth 2 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print

      # 13. Configurar permissões do Gradle
      - name: Prepare Gradle
        shell: bash
        working-directory: extracted/merged
        run: |
          set -euo pipefail

          chmod +x "$PROJECT_ROOT/gradlew"

          cd "$PROJECT_ROOT"

          ./gradlew \
            --no-daemon \
            --console=plain \
            tasks --all

      # 14. Compilar APK Debug
      - name: Build Zalith Launcher APK
        shell: bash
        working-directory: extracted/merged
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version
          cargo-ndk --version

          test -d "$ANDROID_NDK_HOME"

          set +e

          ./gradlew \
            --no-daemon \
            --console=plain \
            --warning-mode summary \
            :ZalithLauncher:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========== ERROS DE COMPILAÇÃO =========="

            grep -n -E \
              '(^e: |FAILED|What went wrong|Compilation error|HomeDashboard\.kt|HomeHeroBanner\.kt|\.kt:[0-9]+:[0-9]+|error:|Unresolved reference|Type mismatch|Caused by)' \
              "$GITHUB_WORKSPACE/build.log" \
              -A8 -B5 | sed -n '1,240p' || true

            echo ""
            echo "========== FINAL DO LOG =========="

            tail -n 160 "$GITHUB_WORKSPACE/build.log"

            exit "$STATUS"
          fi

          echo "Compilação concluída."

      # 15. Localizar e organizar APK
      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final-apk

          mapfile -t APK_FILES < <(
            find "$PROJECT_ROOT" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERRO: APK não encontrado."
            find "$PROJECT_ROOT" -type f -name '*.apk' -print
            exit 1
          fi

          for APK in "${APK_FILES[@]}"; do
            echo "APK encontrado: $APK"
            cp "$APK" "final-apk/$(basename "$APK")"
          done

          ls -lh final-apk

      # 16. Enviar APK como artefato
      - name: Upload Zalith Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Zalith-Launcher-2-APK-Debug
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # 17. Enviar logs para diagnóstico em caso de falha
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Zalith-Build-Diagnostics
          path: |
            build.log
            zip_diagnostics/
            extracted/
          if-no-files-found: warn
          retention-days: 7
          
