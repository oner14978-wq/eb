
name: Build Zalith Launcher 2 APK

# ---------------------------------------------------------------------------
# COMPILAÇÃO COMPLETA DO ZALITH LAUNCHER 2
# 22 pacotes ZIP
# Verificação, extração, análise, correção e compilação Android
# Publicação dos APKs e relatório como Artifacts
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Arquitetura do APK"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - arm64
          - arm
          - x86
          - x86_64

      build_type:
        description: "Tipo de compilação"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - debug
          - release
          - both

  push:
    branches:
      - "**"

concurrency:
  group: zalith-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REPORT_DIR: /tmp/zreport
  SRC_ROOT: /home/runner/zalith-src
  ARCH: ${{ github.event.inputs.arch || 'all' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'auto' }}

jobs:
  build:
    name: Verificar, corrigir e compilar Zalith Launcher 2
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    defaults:
      run:
        shell: bash

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:

      # ---------------------------------------------------------------------
      # 0. PREPARAÇÃO
      # ---------------------------------------------------------------------

      - name: Checkout do repositório
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Preparar ambiente e liberar espaço
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true

          mkdir -p "$REPORT_DIR"
          mkdir -p "$SRC_ROOT"
          mkdir -p /tmp/apks

          : > "$REPORT_DIR/problems.txt"
          : > "$REPORT_DIR/fixed.txt"
          : > "$REPORT_DIR/zips.txt"

          echo "Ambiente preparado."
          df -h /

      # ---------------------------------------------------------------------
      # 1. VERIFICAÇÃO DOS 22 ZIPs
      # ---------------------------------------------------------------------

      - name: "Verificação 1/4 - localizar e testar os 22 ZIPs"
        run: |
          set -uo pipefail

          ZIPS=(
            Zali-03.zip
            Zalit-04.zip
            Zalit-05.zip
            Zalit-06.zip
            Zalit-08.zip
            Zalit-10.zip
            Zalit-18.zip
            Zalith-01.zip
            Zalith-02.zip
            Zalith-09.zip
            Zalith-12.zip
            Zalith-13.zip
            Zalith-20.zip
            ZalithL-14.zip
            ZalithL-15.zip
            ZalithL-16.zip
            ZalithL-21.zip
            ZalithL-22.zip
            ZalithLa-07.zip
            ZalithLa-11.zip
            ZalithLa-17.zip
            ZalithLa-19.zip
          )

          expected=${#ZIPS[@]}
          found=0
          ok=0

          find_one() {
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "$1" \
              -not -path '*/.git/*' \
              2>/dev/null |
              awk '{ print length($0) "\t" $0 }' |
              sort -n |
              cut -f2-
          }

          for n in "${ZIPS[@]}"; do

            mapfile -t hits < <(find_one "$n")

            if [ "${#hits[@]}" -eq 0 ]; then
              echo "::error::ZIP ausente: $n"
              echo "ZIP ausente: $n" >> "$REPORT_DIR/problems.txt"
              continue
            fi

            found=$((found+1))
            f="${hits[0]}"

            if [ "${#hits[@]}" -gt 1 ]; then
              echo "::warning::$n aparece em vários locais."
            fi

            size=$(stat -c %s "$f")
            magic=$(head -c 2 "$f" 2>/dev/null || true)

            if [ "$size" -lt 1024 ] || [ "$magic" != "PK" ]; then
              echo "::error::ZIP inválido ou ponteiro Git LFS: $n"
              echo "ZIP inválido: $n ($size bytes)" >> "$REPORT_DIR/problems.txt"
              continue
            fi

            if ! unzip -tqq "$f" >/dev/null 2>&1; then
              echo "::error::ZIP corrompido: $n"
              echo "ZIP corrompido: $n" >> "$REPORT_DIR/problems.txt"
              continue
            fi

            entries=$(unzip -Z1 "$f" | grep -vc '/$' || true)

            printf 'OK %-20s %12s bytes %6s arquivos\n' \
              "$n" "$size" "$entries"

            echo "$f" >> "$REPORT_DIR/zips.txt"

            ok=$((ok+1))
          done

          readme=""

          for cand in "LEIA-ME.72" "LEIA-ME.7z"; do
            r=$(find_one "$cand" | head -1 || true)

            if [ -n "$r" ]; then
              readme="$r"
              break
            fi
          done

          if [ -z "$readme" ]; then
            readme=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'LEIA-ME*' \
              -not -path '*/.git/*' \
              2>/dev/null | head -1 || true)
          fi

          if [ -n "$readme" ]; then
            echo "$readme" > "$REPORT_DIR/readme_path.txt"
            echo "LEIA-ME encontrado: $readme"
          else
            echo "::warning::LEIA-ME não encontrado."
          fi

          {
            echo "ZIPS_EXPECTED=$expected"
            echo "ZIPS_FOUND=$found"
            echo "ZIPS_OK=$ok"
          } >> "$GITHUB_ENV"

          echo "ZIPs esperados: $expected"
          echo "ZIPs encontrados: $found"
          echo "ZIPs aprovados: $ok"

          if [ "$ok" -ne "$expected" ]; then
            echo "::error::Nem todos os 22 ZIPs passaram na verificação."
            exit 1
          fi

      - name: Ler LEIA-ME
        continue-on-error: true
        run: |
          set -u

          [ -f "$REPORT_DIR/readme_path.txt" ] || exit 0

          f=$(cat "$REPORT_DIR/readme_path.txt")

          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

          mkdir -p /tmp/leiame

          7z x -y -o/tmp/leiame "$f" >/dev/null 2>&1 || {
            echo "::warning::Não foi possível extrair o LEIA-ME."
            exit 0
          }

          echo "Conteúdo do LEIA-ME:"

          find /tmp/leiame -type f -print

          find /tmp/leiame -type f -exec sh -c '
            echo "----- $1 -----"
            head -c 5000 "$1"
            echo
          ' _ {} \;

      # ---------------------------------------------------------------------
      # 2. EXTRAÇÃO DOS PACOTES
      # ---------------------------------------------------------------------

      - name: "Verificação 2/4 - extrair e detectar conflitos"
        run: |
          python3 - <<'PY'
          import os
          import sys
          import zipfile
          import collections
          import stat

          src = os.environ["SRC_ROOT"]
          rep = os.environ["REPORT_DIR"]

          os.makedirs(src, exist_ok=True)

          zips = [
              x.strip()
              for x in open(f"{rep}/zips.txt")
              if x.strip()
          ]

          zips.sort(key=lambda p: os.path.basename(p))

          owners = collections.defaultdict(list)

          for z in zips:
              with zipfile.ZipFile(z) as zf:
                  for i in zf.infolist():

                      if i.is_dir():
                          continue

                      if i.filename.startswith("__MACOSX/"):
                          continue

                      name = i.filename.replace("\\", "/")
                      parts = name.split("/")

                      if name.startswith("/") or ".." in parts:
                          print("::error::Caminho inseguro:", name)
                          sys.exit(1)

                      if "\x00" in name:
                          print("::error::Nome de arquivo inválido.")
                          sys.exit(1)

                      mode = (i.external_attr >> 16) & 0o170000

                      if mode == stat.S_IFLNK:
                          print("::error::Link simbólico não permitido:", name)
                          sys.exit(1)

                      owners[name].append(
                          (z, i.CRC, i.file_size)
                      )

          same = {
              n: v for n, v in owners.items()
              if len(v) > 1 and len({c for _, c, _ in v}) == 1
          }

          diff = {
              n: v for n, v in owners.items()
              if len({c for _, c, _ in v}) > 1
          }

          lower = collections.defaultdict(set)

          for n in owners:
              lower[n.lower()].add(n)

          case = {
              k: v for k, v in lower.items()
              if len(v) > 1
          }

          print("Arquivos únicos:", len(owners))
          print("Duplicados idênticos:", len(same))
          print("Conflitos de conteúdo:", len(diff))
          print("Colisões de nomes:", len(case))

          with open(f"{rep}/problems.txt", "a") as pf:
              with open(f"{rep}/fixed.txt", "a") as ff:

                  for n, v in diff.items():
                      names = ", ".join(
                          os.path.basename(z)
                          for z, _, _ in v
                      )

                      msg = f"Conflito em {n}: {names}"

                      print("::warning::" + msg)
                      pf.write(msg + "\n")

                      ff.write(
                          f"Conflito {n}: prevalece o último ZIP alfabético.\n"
                      )

                  for k, v in case.items():
                      msg = f"Colisão de maiúsculas/minúsculas: {sorted(v)}"
                      pf.write(msg + "\n")
                      print("::warning::" + msg)

          total = 0

          for z in zips:
              with zipfile.ZipFile(z) as zf:

                  for i in zf.infolist():

                      if i.is_dir():
                          continue

                      if i.filename.startswith("__MACOSX/"):
                          continue

                      name = i.filename.replace("\\", "/")
                      dest = os.path.abspath(
                          os.path.join(src, name)
                      )

                      if os.path.commonpath([src, dest]) != os.path.abspath(src):
                          print("::error::Caminho fora da pasta de extração.")
                          sys.exit(1)

                      os.makedirs(os.path.dirname(dest), exist_ok=True)

                      with zf.open(i) as r:
                          with open(dest, "wb") as w:
                              while True:
                                  b = r.read(1024 * 1024)
                                  if not b:
                                      break
                                  w.write(b)

                      mode = (i.external_attr >> 16) & 0o777

                      if mode:
                          os.chmod(dest, mode & 0o755)

                      total += 1

          print(f"Extraídos {total} arquivos para {src}")

          with open(os.environ["GITHUB_ENV"], "a") as g:
              g.write(f"FILES_EXTRACTED={total}\n")
          PY

      # ---------------------------------------------------------------------
      # 3. IDENTIFICAÇÃO DO PROJETO GRADLE
      # ---------------------------------------------------------------------

      - name: "Verificação 3/4 - identificar projeto Android"
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          import glob

          src = os.environ["SRC_ROOT"]
          rep = os.environ["REPORT_DIR"]

          SKIP = {
              "build", ".gradle", ".git",
              "node_modules", ".cxx", "target"
          }

          def walk(base):
              for d, ds, fs in os.walk(base):
                  ds[:] = [x for x in ds if x not in SKIP]
                  yield d, fs

          def read(p):
              with open(p, encoding="utf-8", errors="ignore") as f:
                  return f.read()

          candidates = []

          for d, fs in walk(src):
              for n in ("settings.gradle.kts", "settings.gradle"):
                  if n in fs:
                      candidates.append(
                          (d.count(os.sep), os.path.join(d, n))
                      )

          if not candidates:
              print("::error::Nenhum settings.gradle encontrado.")
              sys.exit(1)

          candidates.sort()

          settings = candidates[0][1]
          proj = os.path.dirname(settings)

          print("PROJECT_DIR =", proj)

          settings_text = read(settings)

          paths = re.findall(
              r"""include\s*\(?\s*["'](:[^"']+)["']\s*\)?""",
              settings_text
          )

          paths += re.findall(
              r"""include\s*\(\s*["'](:[^"']+)["']\s*\)""",
              settings_text
          )

          paths = list(dict.fromkeys(paths))

          overrides = {}

          for m in re.finditer(
              r"""project\s*\(\s*["'](:[^"']+)["']\s*\)\s*\.projectDir\s*=\s*file\s*\(\s*["']([^"']+)["']\s*\)""",
              settings_text
          ):
              overrides[m.group(1)] = m.group(2)

          modules = {}

          for p in paths:
              modules[p] = overrides.get(
                  p,
                  p.strip(":").replace(":", "/")
              )

          app = []
          missing = []

          for p, rel in modules.items():

              d = os.path.normpath(os.path.join(proj, rel))

              bf = [
                  f for f in ("build.gradle.kts", "build.gradle")
                  if os.path.isfile(os.path.join(d, f))
              ]

              if not bf:
                  missing.append(f"{p} -> {rel}")
                  continue

              t = read(os.path.join(d, bf[0]))

              if (
                  re.search(r"com\.android\.application", t)
                  or re.search(r"android\.application", t)
                  or re.search(r"libs\.plugins\.android\.application", t)
              ):
                  app.append((p, rel, os.path.join(d, bf[0])))

          # Fallback: localizar o módulo Android mesmo quando o include
          # utiliza sintaxe Gradle diferente.
          if not app:

              for d, fs in walk(proj):

                  for bf in ("build.gradle.kts", "build.gradle"):

                      if bf not in fs:
                          continue

                      path = os.path.join(d, bf)
                      t = read(path)

                      if (
                          re.search(r"com\.android\.application", t)
                          or re.search(r"android\.application", t)
                          or re.search(r"libs\.plugins\.android\.application", t)
                      ):
                          rel = os.path.relpath(d, proj)
                          app.append((
                              ":" + rel.replace(os.sep, ":").lstrip(":"),
                              rel,
                              path
                          ))

          if not app:
              print("::error::Nenhum módulo Android application encontrado.")
              sys.exit(1)

          if len(app) > 1:
              print("::warning::Vários módulos application encontrados.")
              print("Será utilizado:", app[0][0])

          app_path, app_dir, app_build = app[0]

          print("Módulo principal:", app_path)
          print("Pasta principal:", app_dir)

          # Gradle Wrapper
          gradlew = os.path.join(proj, "gradlew")

          wp = os.path.join(
              proj, "gradle/wrapper/gradle-wrapper.properties"
          )

          wj = os.path.join(
              proj, "gradle/wrapper/gradle-wrapper.jar"
          )

          for label, f in (
              ("gradlew", gradlew),
              ("gradle-wrapper.properties", wp),
              ("gradle-wrapper.jar", wj)
          ):
              if not os.path.isfile(f):
                  print(f"::error::{label} ausente: {f}")
                  sys.exit(1)

          gv_match = re.search(
              r"gradle-([0-9][0-9.]*)-",
              read(wp)
          )

          gv = gv_match.group(1) if gv_match else "?"

          # Android Gradle Plugin
          agp = None

          toml = os.path.join(
              proj, "gradle/libs.versions.toml"
          )

          if os.path.isfile(toml):
              m = re.search(
                  r'^agp\s*=\s*"([^"]+)"',
                  read(toml),
                  re.M
              )
              if m:
                  agp = m.group(1)

          if not agp:

              for d, fs in walk(proj):
                  for f in fs:
                      if not f.startswith("build.gradle"):
                          continue

                      t = read(os.path.join(d, f))

                      m = re.search(
                          r"com\.android\.tools\.build:gradle:([0-9.]+)",
                          t
                      )

                      if m:
                          agp = m.group(1)
                          break

          # JDK principal
          def major(v):
              m = re.match(r"\d+", v or "0")
              return int(m.group()) if m else 0

          main_jdk = 17

          if major(gv) >= 9 or major(agp) >= 9:
              main_jdk = 21

          # Toolchains
          tool = set()

          for d, fs in walk(proj):
              for f in fs:
                  if f.startswith("build.gradle"):
                      t = read(os.path.join(d, f))

                      tool |= {
                          int(x)
                          for x in re.findall(
                              r"JavaLanguageVersion\.of\((\d+)\)",
                              t
                          )
                      }

          # Native
          app_text = read(app_build)

          ndk = re.search(
              r'ndkVersion\s*=\s*"([^"]+)"',
              app_text
          )

          mk = re.search(
              r'ndkBuild\s*\{\s*path\s*=\s*file\("([^"]+)"\)',
              app_text,
              re.S
          )

          has_rust = bool(
              glob.glob(
                  os.path.join(proj, "**/Cargo.toml"),
                  recursive=True
              )
          )

          # Contagem
          cnt = {
              "kt": 0,
              "java": 0,
              "xml": 0,
              "res_dirs": 0
          }

          for d, fs in walk(proj):

              if os.path.basename(d) == "res" and "src" in d:
                  cnt["res_dirs"] += 1

              for f in fs:
                  e = f.rsplit(".", 1)[-1]
                  if e in cnt:
                      cnt[e] += 1

          print("Kotlin:", cnt["kt"])
          print("Java:", cnt["java"])
          print("XML:", cnt["xml"])
          print("Recursos:", cnt["res_dirs"])

          manifest = os.path.join(
              proj, app_dir, "src/main/AndroidManifest.xml"
          )

          if not os.path.isfile(manifest):
              print("::error::AndroidManifest.xml ausente:", manifest)
              sys.exit(1)

          if cnt["kt"] == 0 and cnt["java"] == 0:
              print("::error::Nenhum arquivo Kotlin ou Java encontrado.")
              sys.exit(1)

          print("Gradle:", gv)
          print("AGP:", agp or "não identificado")
          print("JDK:", main_jdk)
          print("Toolchains:", sorted(tool))
          print("NDK:", ndk.group(1) if ndk else "não declarado")
          print("Rust:", has_rust)

          
          env = {
              "PROJECT_DIR": proj,
              "APP_DIR": app_dir,
              "APP_PATH": app_path,
              "APP_BUILD_FILE": app_build,
              "GRADLE_VERSION": gv,
              "AGP_VERSION": agp or "",
              "JDK_MAIN": str(main_jdk),
              "JAVA_TOOLCHAINS": ",".join(map(str, sorted(tool))),
              "NDK_VERSION": ndk.group(1) if ndk else "",
              "HAS_RUST": str(has_rust).lower(),
              "ANDROID_MANIFEST": manifest,
              "KOTLIN_FILES": str(cnt["kt"]),
              "JAVA_FILES": str(cnt["java"]),
              "XML_FILES": str(cnt["xml"])
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key, value in env.items():
                  value = str(value).replace("\n", "").replace("\r", "")
                  f.write(f"{key}={value}\n")

          print("Projeto Android identificado com sucesso.")
          print("Raiz Gradle:", proj)
          print("Módulo Android:", app_path)
          print("JDK:", main_jdk)
          PY
          
              
